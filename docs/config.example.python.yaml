# Starter .factory/config.yaml for a Python repo (pyproject.toml + pytest). Copy it, then trim.
# Every key is optional; see docs/config.example.yaml for the full reference.
# With no `checks`, CHECK runs `python3 -m pytest` when it finds a pytest surface.
version: 2

# PR body footer: unset uses the text below; a non-empty string is used verbatim.
# Use footer: "" to remove the footer and its separator. No templating or token substitution.
# pr:
#   footer: 'This PR was made by Software Factory'

# What CHECK runs after every BUILD. Each command is one shell-free command line run from the
# repo root (no pipes, `&&`, `$VARS` or globs); point at a script when you need a shell.
checks:
  build: python3 -m compileall -q src
  test: python3 -m pytest
  lint: ruff check .

# Paths that always need a human reviewer.
classifier:
  alwaysHuman:
    - 'migrations/**'
    - 'pyproject.toml'
