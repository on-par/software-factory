# Reference for .factory/config.yaml. Generated by `npm run config-example` from the config
# schemas and packaged defaults. Do not edit by hand.
#
# .factory/config.yaml is preferred; .factory/config.yml and .factory/config.json are still
# read (keep only one). `factory migrate --to-yaml` converts a JSON config. Copy only the keys you
# want to change: copying this whole file pins today’s defaults, so later default changes
# would not reach your repo. A minimal config is `version: 2`.
#
# Commented-out keys are unset by default. Setting one outranks the matching FACTORY_* env
# var, so leave it out to keep env control. The value shown is the default, or a <placeholder>
# when there is none. `factory status --kpis` prints the effective config.
#
# Starter configs for typical repos: docs/config.example.dotnet.yaml, docs/config.example.node.yaml,
# docs/config.example.python.yaml. `factory init --detect-checks` fills in `checks` for you.
#
# Accepted but not shown:
#   $schema — accepted and ignored.
#   policy — written by `factory migrate`; not read at runtime.
#   merge — legacy spelling of run.merge; run.merge wins when both are set.
#   adr — accepted; not read at runtime.
#   byok — accepted; not read at runtime.
#   cost_tracking — accepted; not read at runtime.
#   discovery — accepted; not read at runtime.
#   notifications — accepted; not read at runtime.
#   paths.* other than paths.constitution — accepted; not read at runtime.
version: 2
# models:
  # Repo-declared models: model id -> definition, same fields as a packaged model. Merged over the
  # packaged registry before tiers and pins, so these ids can be pinned and placed in tiers. Ids
  # must not reuse a packaged model id.
  # registry:
    # my-opencode-model:
      # provider: "custom"
      # tier: ["worker"]
      # costPerMtokInput: 0
      # costPerMtokOutput: 0
      # contextWindow: 200000
      # capabilities: ["implementation"]
      # envKey: null
      # harness: "opencode"
      # providerModel: "<provider>/<model>"
  # Model id -> effort, or task type -> effort. Omitted tasks retain provider/profile defaults.
  # Boolean values are Ollama thinking toggles.
  # efforts: { "<model id>": "<effort>" }
  # Per-phase model pins. Each value is a model id from `factory models`. Unset: tier resolution.
  # pins:
    # PLAN model. Beats FACTORY_PLAN_MODEL.
    # plan: "<model id>"
    # PLAN model tried when the pinned plan model fails or its provider is tripped.
    # planFallback: "<model id>"
    # BUILD model. Beats FACTORY_BUILD_MODEL. When `route` is unset, its harness also picks the
    # build route.
    # build: "<model id>"
    # Codex-capable model to use after a Claude BUILD failure.
    # buildFallback: "<model id>"
    # Checker model. Replaces the checker tier.
    # checker: "<model id>"
    # Triage model. Replaces the triage tier.
    # triage: "<model id>"
    # PR classifier model (classify_pr route). Unset: the checker tier. Changing it demotes the
    # classifier (ADR-0121).
    # classifier: "<model id>"
  # Per role (boss, worker, checker, triage): subscription providers in failover order, as model
  # ids, at most one per provider (claude, codex, opencode-go). Unset role: today's tier order for
  # that role with opencode-go last. OpenCode Zen (opencode/) models are refused. Not used for
  # run-time failover yet.
  # providerOrder:
    # Boss providers in failover order.
    # boss: ["<model id>", ...]
    # Worker providers in failover order.
    # worker: ["<model id>", ...]
    # Checker providers in failover order.
    # checker: ["<model id>", ...]
    # Triage providers in failover order.
    # triage: ["<model id>", ...]
# Repo-declared agent CLIs: harness id -> declaration (command, prompt, output, agentic, usage,
# optional errorPatterns and probe). Run through the built-in `command` harness. Reference an id
# from a models.registry entry's `harness`. Built-in harness ids cannot be redeclared.
# harnesses:
  # my-agent:
    # command: "my-agent --model {model}"
    # prompt: "stdin"
    # output: "stdout"
    # agentic: true
    # usage: "none"
# Tier name -> ordered model ids. Replaces that packaged tier; the router uses the first available
# model. An unknown model id fails loudly. The packaged tiers are:
# tiers:
  # boss: ["claude-opus-5", "qwen2.5-coder:14b", "gemma4:12b", "claude-fable-5", "claude-opus-4-8", "claude-sonnet-5", "glm-5.2", "gpt-5.6-terra-high"]
  # worker: ["codex-ollama-qwen3.5:9b", "qwen2.5-coder:14b", "qwen3.5:9b", "qwen3:8b", "gpt-5.6-terra-medium", "gpt-5.6-sol", "gpt-5.1-codex", "claude-sonnet-5", "glm-5.2", "qwen-3.5-coder", "opencode-sonnet"]
  # checker: ["qwen3.5:9b", "gemma4:12b", "qwen2.5-coder:14b", "qwen3:8b", "claude-sonnet-5", "gpt-5.6-luna-high", "glm-5.2"]
  # triage: ["qwen2.5-coder:14b", "claude-sonnet-5", "glm-5.2", "gpt-5.6-luna-high"]
# Provider switches. Unset leaves a provider on. `false` removes its models from every tier.
# providers:
  # anthropic: true
  # An explicit value beats the FACTORY_CODEX=0 kill-switch.
  # openai: true
  # ollama: true
# Build route for every issue: "codex", "claude", "opencode", or "command" (a declared agentic
# harness under `harnesses`). Unset: derived from the build pin's harness, else PLAN decides per
# issue.
# route: "<route>"
# Named evidence commands for design-artifact evidence plans (not the CHECK build/test/lint
# commands; see `checks`). Shell-free argv; config overrides scripts.
# commands: { test: "vitest run" }
# PR body presentation.
# pr:
  # Last line of the PR body. Unset: "This PR was made by Software Factory". A non-empty string
  # replaces it verbatim; "" removes the footer and its separator. Plain string only, with no
  # templating or token substitution.
  # footer: "This PR was made by Software Factory"
# CHECK commands for this repo (build, test, lint). Each beats the file-based guess; `factory init
# --detect-checks` writes them.
# checks: { build: "dotnet build", test: "dotnet test", lint: "dotnet format --verify-no-changes" }
# App smoke commands for the opt-in app_smoke checker.
# qa: { start: ["npm", "start"], smoke: ["npm", "run", "smoke"] }
# Repo risk policy for the risk receipt and the land risk gate (schema:
# packages/config/src/risk.ts). Unset: the packaged default rules.
# risk:
  # Risk rules. They replace the packaged rules; a path that matches no rule is `med`.
  # rules: [{ id: "my-rule", tier: "high", globs: ["<glob>"] }]
  # Globs for allowlisted pure-refactor paths; they fire the low 'allowlisted-refactor' rule.
  # refactorAllowlist: ["<glob>"]
# budget:
  # Run-wide usage cap in USD. Beats FACTORY_USAGE_CAP.
  # capUsd: 227
  # Hard USD cap per issue, on top of the run-wide cap. Unset: no per-issue cap.
  # perIssueCapUsd: <usd>
  # Trade expensive exploration for a bounded PLAN path.
  # fastPath: false
  # Checker-rework retries per issue (0-3).
  # maxReworkRounds: 1
  # Lane circuit breaker threshold (non-negative integer). 0 turns the breaker off. Unset: 2.
  # laneBreakerThreshold: 2
  # Usage watchdog. `factory run` / `supervise` flags beat these values.
  # watchdog:
    # Usage fraction (0-1] at which work pauses. Beats FACTORY_STOP_AT.
    # stopAt: 0.75
    # Usage fraction (0-1] at which paused work resumes. Beats FACTORY_RESUME_AT.
    # resumeAt: 0.65
    # Seconds between usage polls. Beats FACTORY_USAGE_POLL.
    # pollSeconds: 180
    # Enforce the usage gate. Beats FACTORY_USAGE_WATCH.
    # watch: true
    # Use the list-price usage estimator. Beats FACTORY_USAGE_ESTIMATOR.
    # estimator: false
# Review floor rules for the PR classifier. Unset keys use the packaged floor rules.
# classifier:
  # Path prefixes or globs forced to review class C. Added to the packaged C rules, never replacing
  # them.
  # alwaysHuman: ["<path prefix or glob>"]
  # Path prefixes or globs eligible for class A. Replaces the packaged A rules (docs/, *.md,
  # *.test.ts).
  # autoEligible: ["<path prefix or glob>"]
  # Total added+removed lines above which the floor is at least B.
  # maxDiffLines: 500
  # Merge trust tier for this repo (ADR-0144). Unset: T0, a human merges every PR.
  # trustTier: T0
# Which checks decide base health (#3290).
# baseHealth:
  # Check-run names that decide whether main is green for the base-hold gate and base health. Unset:
  # the branch-protection required checks, else the check runs of the push workflow named CI. Other
  # failed push workflows (Release, deploy) log base_push_workflow_failed and never hold.
  # checks: ["<check-run name>"]
# CHECK phase settings (#3272, #3540).
# check:
  # Run CHECK commands with an empty global and system git config (GIT_CONFIG_GLOBAL=/dev/null,
  # GIT_CONFIG_NOSYSTEM=1), as on a CI runner. Set false when checks need host git settings such as
  # a credential helper. Unset: true.
  # hermeticGit: true
  # Hours a cached baseline (base SHA) checker result is reused before CHECK and base health re-run
  # it (#3540). Unset: 24.
  # baselineCacheTtlHours: 24
# Merge policy. `factory run` and `supervise` read `auto`; `factory land` reads `admin`. `factory
# ship` and `run-issue` stop at a ready-for-review PR unless `pr.draft` / `--draft-pr` is set.
# run:
  # merge:
    # Squash-merge eligible PRs. Unset: legacy merge.auto, then FACTORY_MERGE=1. --auto-merge /
    # --no-auto-merge beat all.
    # auto: false
    # Merge with GitHub admin bypass of unmet requirements. Unset: FACTORY_MERGE_ADMIN=1.
    # admin: false
    # Hold PRs whose review floor is B or C (or cannot be computed) for a human by applying
    # no-auto-merge. Unset: FACTORY_PR_CLASSIFIER=1. --pr-classifier / --no-pr-classifier beat all.
    # classifier: false
  # pr:
    # Stop SHIP at a draft PR: skip mark-ready and auto-merge. Unset: off. --draft-pr /
    # --no-draft-pr beat it.
    # draft: false
# Phase timeouts in seconds. tests_seconds caps the tests checker command (scripts/verify.sh, npm
# test or pytest). compile_seconds caps the compile checker command (npm run build, make or cargo
# build). FACTORY_PLAN_TIMEOUT, FACTORY_BUILD_TIMEOUT, FACTORY_CHECK_TIMEOUT,
# FACTORY_APPROVAL_TIMEOUT, FACTORY_TESTS_TIMEOUT and FACTORY_COMPILE_TIMEOUT beat these values.
timeouts:
  plan_seconds: 1800
  build_seconds: 7200
  check_seconds: 1800
  merge_poll_seconds: 120
  approval_seconds: 1800
  tests_seconds: 300
  compile_seconds: 120
# OPTIONAL pre-code gate: when true (or --approve-plan / FACTORY_APPROVE_PLAN=1), PLAN pauses after
# freezing the spec and waits for operator approval before BUILD. Default off keeps unattended
# auto-plan. Independent of the SHIP/auto-merge gate.
plan_approval:
  enabled: false
# Design-artifact gates at PLAN. blockUnresolvedRegressions: true stops PLAN before BUILD when a
# worse/unknown behaviorDelta row is not in openQuestions (default false logs
# design_regression_unresolved only). FACTORY_DESIGN_BLOCK_REGRESSIONS=1/0 beats it.
design:
  blockUnresolvedRegressions: false
# PLAN readiness enrichment for incomplete factory-task issues. updateIssueBody: true (default)
# writes the enriched sections back to the GitHub issue under a <!-- factory:enriched --> block,
# below the original text, which is kept verbatim; false keeps enrichment in memory only.
# FACTORY_READINESS_UPDATE_BODY=1/0 beats it.
readiness:
  updateIssueBody: true
# BUILD policy. publishFromBuild: true lets the claude BUILD worker push, open a PR and wait for CI
# before CHECK (the old behavior). Default false keeps BUILD commit-only on every route; SHIP pushes
# and opens the PR after CHECK. FACTORY_BUILD_PUBLISH=1/0 beats it. contextCeiling (default {
# codex-cli: 120000 }) is the per-harness context ceiling for BUILD and rework: Codex compacts the
# session at that many tokens; 0 turns it off; only codex-cli honours it today (#3327).
build:
  publishFromBuild: false
  contextCeiling:
    codex-cli: 120000
# Size gate policy at PLAN (ADR-0147, ADR-0156). mode: file (default) files child issues for an
# oversized issue and parks when the post-plan gate trips; slice keeps the issue whole, never files
# issues, records a slice plan comment and ships one slice per run; off skips both gates and sends
# the whole issue to BUILD; stack (ADR-0161) ships one stacked slice PR per run and builds the next
# slice only after the PR below is approved or merged. maxSlices (1-20, default 10) caps a slice
# plan that has not started: an over-cap plan is recorded and parks, and `--max-slices <n>` beats it
# for one run. tokenBudget (default 150000) and maxFiles (default 12) (#3350): the post-plan gate
# splits only when the plan's estimated tokens exceed tokenBudget or its changed files exceed
# maxFiles; a plan changing 3 files or fewer never splits. `factory run-issue --size-gate <mode>`
# beats mode for one run.
sizeGate:
  mode: "file"
  maxSlices: 10
  tokenBudget: 150000
  maxFiles: 12
# Set FACTORY_SKIP_CI=1 to skip waiting for GitHub Actions CI before merging. An awaiting-ci PR
# parks as ci-never-started after awaitingCiCapHours hours with no CI run.
ci:
  skip: false
  awaitingCiCapHours: 24
  # Minutes SHIP waits for CI before reporting CI pending and leaving the PR as draft. Unset: 10.
  # watchMinutes: 10
# Where lane worktrees are created. "~/..." or an absolute path is a shared root, namespaced as
# <parent>/<owner>/<repo>/. A repo-relative path is used as-is: "../" gives the old sibling layout;
# ".factory/worktrees" keeps them inside the repo (auto-added to .git/info/exclude) but the repo's
# own tools (jest, eslint, tsc, globbing scripts) may crawl into those nested checkouts.
worktree:
  parent: "~/.factory/worktrees"
  gcTtlDays: 7
  autoGcOnRun: true
# Lane workspace backend: "host" (git worktrees) or "disposable-docker" (a managed container per
# lane).
workspace:
  backend: "host"
# Containment for agentic build runs. Disable per-run with --no-sandbox or FACTORY_SANDBOX=0. Empty
# network.allow denies all egress; non-empty leaves egress open in report mode. Set sandbox.runtime
# (auto|sandbox-exec|firejail|docker-sandbox|none) or FACTORY_SANDBOX_RUNTIME to pick a runtime;
# auto probes the host. docker-sandbox is reserved for the microVM runtime and does not contain
# anything yet (#653). sandbox.docker.rolloutPercent (0-100) deterministically promotes that
# percentage of unpinned lanes into the docker-sandbox cohort for A/B evidence (#655).
# sandbox.network.blockTelemetry (default false) makes the egress proxy refuse known telemetry hosts
# (e.g. *.datadoghq.com) with 403, even if allowlisted; it only takes effect where the egress proxy
# runs (sandbox-exec with a non-empty allowlist) (#2667). sandbox.network.mode (report|enforce,
# default report; FACTORY_SANDBOX_NETWORK overrides) — enforce on sandbox-exec denies direct
# outbound connections and makes the egress proxy refuse hosts not on network.allow with 403
# (#2215). sandbox.writablePaths (default []) adds directories BUILD/CHECK may write, e.g.
# ["~/.nuget"]; entries must be absolute or start with ~/, and may not be /, ~, the home dir, or a
# path equal to or containing the repo checkout (#3454).
sandbox:
  enabled: true
  runtime: "auto"
  codexFullAccessTasks: []
  writablePaths: []
  network:
    allow: ["api.anthropic.com", "github.com"]
    blockTelemetry: false
    mode: "report"
  resources:
    cpuMs: 300000
    memMb: 4096
  docker:
    rolloutPercent: 0
# Per-lane runtime environment.
environment:
  # Per-lane app-port leases (.factory/ports.json). Each lane gets a unique port injected as
  # PORT/FACTORY_APP_PORT/FACTORY_BASE_URL into BUILD/CHECK agent runs. Disable per-run with
  # FACTORY_ENV_PORTS=0.
  ports:
    enabled: true
    range: [3100, 3999]
  # Grace period in ms between SIGTERM and SIGKILL when a lane's process group is swept.
  processGroups:
    graceMs: 5000
  # Opt-in loopback reverse proxy giving each lane a stable URL http://<lane>.<domain>[:port].
  # Routes resolve per-request from .factory/ports.json so they always track the lease lifecycle.
  # Binds 127.0.0.1 only. *.localhost resolves to loopback in Chrome/Firefox and per RFC 6761;
  # Safari/curl may need dnsmasq with a .test domain — documented, not solved, in v1. Started
  # in-process by `factory run`/`supervise`, or manually via `factory proxy`. If the port cannot be
  # bound (e.g. :80 without privileges on Linux) lanes degrade to port-based URLs with one
  # informational log line. Override per-run with FACTORY_PROXY=1/0.
  proxy:
    enabled: false
    port: 80
    domain: "factory.localhost"
# Host-wide cap on lanes in BUILD or CHECK at once, shared by every runner on this machine through
# slot files in ~/.factory/host/build-slots/. A lane waits for a free slot before each BUILD/CHECK
# phase. maxAgentJobs caps ad-hoc rescue/steward jobs started with `factory agent-job`, through
# lease files in ~/.factory/host/agent-jobs/. loadGuard holds new issue claims while the host
# 5-minute load average is above maxLoad (default 3x CPU count), retrying every retrySeconds;
# enabled: false or FACTORY_LOAD_GUARD=0 turns it off.
host:
  maxBuilds: 2
  maxAgentJobs: 1
  loadGuard:
    enabled: true
    retrySeconds: 60
# Host disk guard (#2284): lanes hold new claims and BUILD/CHECK phases wait while free space on the
# worktree root or state root volume is below minFreeGb (GiB), re-checking every 5 minutes. 0 or
# FACTORY_MIN_FREE_GB=0 turns it off.
disk:
  minFreeGb: 10
# Supervisor circuit breaker for cross-harness build failover. On a quota trip
# (usage_cap/rate_limit) the Codex provider is skipped for cooldown_minutes: the lane that trips it
# falls over to fallback_model (when available); every later lane during the cooldown is routed
# straight to claude via the existing codexDisabled path (default tier order, not necessarily
# fallback_model). Configure enabled, cooldown_minutes and fallback_model in .factory/config.json;
# environment variables do not override this policy.
auto_failover:
  enabled: true
  cooldown_minutes: 30
  fallback_model: "claude-sonnet-5"
# GitHub-labels queue settings. claim_settle_ms is how long a lane waits after writing its claim
# before it confirms the claim, so a lane on another host racing for the same issue is seen (#3145).
# Non-negative integer milliseconds; 0 turns the wait off. max_review_rework_runs caps review-rework
# runs per issue (#3565); at the cap a further trusted changes-requested review starts no run and
# parks the issue. Non-negative integer; 0 means a changes-request always parks.
queue:
  claim_settle_ms: 3000
  max_review_rework_runs: 2
# Always-on auto-ingest. When enabled, `factory supervise` polls each cycle for open issues carrying
# `label` and appends new ones (deduped against the queue and open factory/* PRs, legacy ship-it
# branches included) to the queue under `lane`. Enable per-run with FACTORY_AUTO_INGEST=1; disable
# with =0.
ingest:
  enabled: false
  label: "ready"
  lane: "auto"
  maxPerCycle: 20
intake:
  # GitHub logins whose approval counts. Unset: users with admin permission on the repo.
  # trustedApprovers: ["<login>"]
  enforce: "warn"
# Guardrails for auto-filing self-defects. excludeReasons are never filed unless the same
# fingerprint parks >= repeatThreshold times. maxPerRun/maxPerDay cap new bugs. Bugs whose origin is
# factory-internal get selfFixLabel so the merge path refuses auto-merge (human approval required).
filing:
  enabled: true
  excludeReasons: ["rate_limit", "usage_cap", "timeout", "verify_failed"]
  repeatThreshold: 3
  maxPerRun: 5
  maxPerDay: 20
  selfFixLabel: "no-auto-merge"
  bugLabels: ["bug"]
  sensitivePaths: ["packages/core/", "packages/config/", "packages/cli/", "scripts/", ".github/"]
# Post-merge defect window (#612): after a factory PR merges, follow-up signals (revert commits, new
# issues back-referencing the PR/issue/merge commit, non-bot post-merge comments raising concerns)
# are watched for this many days. A run is only scored once its window has closed. Override with
# FACTORY_DEFECT_WINDOW_DAYS.
kpis:
  defectWindowDays: 14
# events:
  # Rotate once the live file passes this many bytes. Unset: 10485760 (10 MiB).
  # FACTORY_EVENTS_MAX_BYTES beats it.
  # maxBytes: 10485760
  # Keep only the newest N rotated segments. Unset: keep all. FACTORY_EVENTS_MAX_SEGMENTS beats it.
  # maxSegments: 20
# Optional: set sweep.heartbeatFile (or export HEARTBEAT_FILE) to the path an auto-merge-sweep loop
# writes an ISO8601 timestamp to once per pass (see scripts/auto-merge-sweep.sh,
# docs/runbooks/sweep-heartbeat.md). factory doctor/status fail when it is older than
# loopIntervalSeconds * staleThresholdMultiplier seconds. Unset means no sweep is configured for
# this repo — no check runs.
sweep:
  # heartbeatFile: "<path>"
  loopIntervalSeconds: 300
  staleThresholdMultiplier: 2
# Only paths.constitution is read: the repo-relative path of the product constitution.
paths:
  constitution: ".factory/constitution.md"
