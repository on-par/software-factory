);\n    expect(report).toContain('- `a`: pass — Core 0/0 (calculator / checkpoint_1)');\n  });\n\n  it('groups erosion by evaluation.problem_name, ordering checkpoints numerically', () => {\n    const trials = [\n      trialAt(\n        'suite/calculator/1',\n        {},\n        {\n          evaluation: minimalEvaluation({ problem_name: 'calculator', checkpoint_name: 'checkpoint_1' }),\n          runInfoPresent: false,\n        },\n      ),\n      trialAt(\n        'suite/calculator/2',\n        {},\n        {\n          evaluation: minimalEvaluation({\n            problem_name: 'calculator',\n            checkpoint_name: 'checkpoint_2',\n            pass_counts: { Core: 1 },\n            total_counts: { Core: 3 },\n          }),\n          runInfoPresent: false,\n        },\n      ),\n      trialAt(\n        'suite/calculator/10',\n        {},\n        {\n          evaluation: minimalEvaluation({ problem_name: 'calculator', checkpoint_name: 'checkpoint_10' }),\n          runInfoPresent: false,\n        },\n      ),\n      trialAt(\n        'suite/other/1',\n        {},\n        {\n          evaluation: minimalEvaluation({ problem_name: 'other', checkpoint_name: 'checkpoint_1' }),\n          runInfoPresent: false,\n        },\n      ),\n    ];\n    const report = generateBaselineReport(config, trials);\n\n    expect(report).toContain(\n      '- calculator: checkpoint_1 `suite/calculator/1`: pass (Core 3/3), checkpoint_2 `suite/calculator/2`: fail (Core 1/3), checkpoint_10 `suite/calculator/10`: pass (Core 3/3)',\n    );\n    expect(report).toContain('- other: checkpoint_1 `suite/other/1`: pass (Core 3/3)');\n    expect(report).not.toContain('Not yet measurable');\n  });\n\n  it('falls back to lexicographic checkpoint_name ordering when neither checkpoint has a trailing integer', () => {\n    const trials = [\n      trialAt(\n        'suite/calculator/final',\n        {},\n        {\n          evaluation: minimalEvaluation({ problem_name: 'calculator', checkpoint_name: 'checkpoint_final' }),\n          runInfoPresent: false,\n        },\n      ),\n      trialAt(\n        'suite/calculator/alpha',\n        {},\n        {\n          evaluation: minimalEvaluation({ problem_name: 'calculator', checkpoint_name: 'checkpoint_alpha' }),\n          runInfoPresent: false,\n        },\n      ),\n    ];\n    const report = generateBaselineReport(config, trials);\n    expect(report).toContain(\n      '- calculator: checkpoint_alpha `suite/calculator/alpha`: pass (Core 3/3), checkpoint_final `suite/calculator/final`: pass (Core 3/3)',\n    );\n  });\n\n  it('tiebreaks by trial id when checkpoint_name is identical across trials in a problem', () => {\n    const sameCheckpoint = (id: string) =>\n      trialAt(\n        id,\n        {},\n        {\n          evaluation: minimalEvaluation({\n            problem_name: 'dup',\n            checkpoint_name: 'checkpoint_shared',\n            pass_counts: { Functionality: 1 },\n            total_counts: { Functionality: 1 },\n          }),\n          runInfoPresent: false,\n        },\n      );\n    const trials = [sameCheckpoint('suite/dup/c'), sameCheckpoint('suite/dup/a'), sameCheckpoint('suite/dup/b')];\n    const report = generateBaselineReport(config, trials);\n    expect(report).toContain(\n      '- dup: checkpoint_shared `suite/dup/a`: pass (Core 0/0), checkpoint_shared `suite/dup/b`: pass (Core 0/0), checkpoint_shared `suite/dup/c`: pass (Core 0/0)',\n    );\n  });\n\n  it('states the not-yet-measurable erosion sentence when no trial carries native evaluation evidence', () => {\n    const report = generateBaselineReport(config, [trialAt('smoke/trial-1'), trialAt('smoke/trial-2')]);\n    expect(report).toContain(\n      'Not yet measurable — requires native SCBench evaluation evidence from the live multi-checkpoint suite run.',\n    );\n  });\n});\n\ndescribe('baseline report drift', () => {\n  it('regenerates the committed report.md byte-identically from the committed config + manifests', () => {\n    const config = loadBaselineConfig(readFileSync(BASELINE_CONFIG_PATH, 'utf-8'));\n    const trials = collectBaselineTrials(RUNS_DIR);\n    const regenerated = generateBaselineReport(config, trials);\n    const committed = readFileSync(REPORT_PATH, 'utf-8');\n    expect(regenerated).toBe(committed);\n  });\n});\n\nfunction writeFactoryArtifacts(dir: string, workspace: string) {\n  mkdirSync(dir, { recursive: true });\n  writeFileSync(\n    join(dir, 'manifest.json'),\n    JSON.stringify(minimalManifest({ run: { ...minimalManifest().run, workspace } })),\n  );\n  writeFileSync(join(dir, 'request.json'), '{}');\n  writeFileSync(join(dir, 'events.ndjson'), '');\n  writeFileSync(join(dir, 'diff.patch'), '');\n}\n\ndescribe('smoke checkpoint run twice (reproducibility)', () => {\n  const realExec = createExecaExec();\n  let workspaces: string[] = [];\n  let artifactRoots: string[] = [];\n\n  afterEach(() => {\n    for (const dir of [...workspaces, ...artifactRoots]) rmSync(dir, { recursive: true, force: true });\n    workspaces = [];\n    artifactRoots = [];\n  });\n\n  it('produces host-independent, comparable manifests across two independent trials', async () => {\n    const checkpoint: ScbenchCheckpoint = { problemId: 'smoke', checkpointId: '1', index: 0, task: 'Prove wiring.' };\n    const results = [];\n\n    for (let i = 0; i <"+" 2; i += 1) {\n      const workspace = mkdtempSync(join(tmpdir(), `scb-baseline-smoke-ws-${i}-`));\n      const artifactsRoot = mkdtempSync(join(tmpdir(), `scb-baseline-smoke-art-${i}-`));\n      workspaces.push(workspace);\n      artifactRoots.push(artifactsRoot);\n\n      const exec: ExecFn = async (argv, opts) => {\n        const [bin, ...rest] = argv;\n        if (bin === 'git') return realExec(argv, opts);\n        if (bin === 'stub-factory') {\n          writeFactoryArtifacts(rest[5], workspace);\n          return { exitCode: 0, stdout: '', stderr: '' };\n        }\n        throw new Error(`unexpected command: ${argv.join(' ')}`);\n      };\n\n      results.push(await runCheckpoint(checkpoint, { workspace, artifactsRoot, factoryBin: 'stub-factory' }, { exec }));\n    }\n\n    expect(results.map((r) => r.outcome)).toEqual(['ready', 'ready']);\n\n    for (let i = 0; i <"+" 2; i += 1) {\n      const dir = join(artifactRoots[i], 'smoke', '1');\n      expect(existsSync(join(dir, 'brief.md'))).toBe(true);\n      expect(existsSync(join(dir, 'manifest.json'))).toBe(true);\n      expect(existsSync(join(dir, 'request.json'))).toBe(true);\n    }\n\n    const normalize = (i: number) => {\n      const raw = JSON.parse(readFileSync(join(artifactRoots[i], 'smoke', '1', 'manifest.json'), 'utf-8'));\n      return { ...raw, run: { ...raw.run, workspace: '<"+"workspace>' } };\n    };\n    expect(normalize(0)).toEqual(normalize(1));\n  });\n});\n"},"packages/scbench-adapter/src/workspace.test.ts":{"tests":[{"id":"79","name":"prepareWorkspace initializes git and .factory dirs on a fresh workspace"},{"id":"80","name":"prepareWorkspace throws AdapterError when git init fails, without creating a fake .git"},{"id":"81","name":"prepareWorkspace falls back to stdout in the git-init failure message when stderr is empty"},{"id":"82","name":"prepareWorkspace does not re-init git when .git already exists (idempotent)"},{"id":"83","name":"prepareWorkspace does not duplicate the exclude entry on a second run"},{"id":"84","name":"prepareWorkspace propagates a non-ENOENT error reading the exclude file (e.g. it is a directory)"},{"id":"85","name":"prepareWorkspace preserves existing exclude entries and appends a trailing newline"},{"id":"86","name":"commitCheckpoint adds and commits with the checkpoint id in the message"},{"id":"87","name":"commitCheckpoint tolerates \"nothing to commit\""},{"id":"88","name":"commitCheckpoint throws AdapterError on any other git failure"},{"id":"89","name":"commitCheckpoint falls back to stdout in the failure message when stderr is empty"},{"id":"90","name":"createExecaExec runs a real command and reports its exit code without throwing"},{"id":"91","name":"createExecaExec falls back to execa's shortMessage on a spawn failure (missing binary)"}],"source":"import { existsSync, mkdirSync, mkdtempSync, readFileSync, rmSync, writeFileSync } from 'node:fs';\nimport { tmpdir } from 'node:os';\nimport { join } from 'node:path';\n\nimport { afterEach, beforeEach, describe, expect, it } from 'vitest';\n\nimport { AdapterError } from './checkpoint.js';\nimport { commitCheckpoint, createExecaExec, prepareWorkspace, type ExecFn } from './workspace.js';\n\nfunction fakeExec(): { exec: ExecFn; calls: string[][] } {\n  const calls: string[][] = [];\n  const exec: ExecFn = async (argv) => {\n    calls.push([...argv]);\n    return { exitCode: 0, stdout: '', stderr: '' };\n  };\n  return { exec, calls };\n}\n\ndescribe('prepareWorkspace', () => {\n  let dir: string;\n\n  beforeEach(() => {\n    dir = mkdtempSync(join(tmpdir(), 'scbench-workspace-'));\n  });\n\n  afterEach(() => {\n    rmSync(dir, { recursive: true, force: true });\n  });\n\n  it('initializes git and .factory dirs on a fresh workspace', async () => {\n    const { exec, calls } = fakeExec();\n\n    await prepareWorkspace(dir, { exec });\n\n    expect(calls[0]).toEqual(['git', 'init']);\n    expect(calls[1]).toEqual(['git', 'add', '-A']);\n    expect(calls[2]).toContain('commit');\n    expect(existsSync(join(dir, '.factory'))).toBe(true);\n    expect(existsSync(join(dir, '.factory', 'logs'))).toBe(true);\n    expect(existsSync(join(dir, '.factory', 'plans'))).toBe(true);\n    const exclude = readFileSync(join(dir, '.git', 'info', 'exclude'), 'utf-8');\n    expect(exclude).toContain('.factory/');\n  });\n\n  it('throws AdapterError when git init fails, without creating a fake .git', async () => {\n    const exec: ExecFn = async (argv) => {\n      if (argv[1] === 'init') return { exitCode: 1, stdout: '', stderr: 'git: command not found' };\n      return { exitCode: 0, stdout: '', stderr: '' };\n    };\n\n    await expect(prepareWorkspace(dir, { exec })).rejects.toThrow(AdapterError);\n\n    // No .factory/.git/info/exclude setup should have happened — a failed\n    // `git init` must not leave the idempotency check fooled on a later call.\n    expect(existsSync(join(dir, '.factory'))).toBe(false);\n  });\n\n  it('falls back to stdout in the git-init failure message when stderr is empty', async () => {\n    const exec: ExecFn = async (argv) => {\n      if (argv[1] === 'init') return { exitCode: 1, stdout: 'permission denied', stderr: '' };\n      return { exitCode: 0, stdout: '', stderr: '' };\n    };\n\n    await expect(prepareWorkspace(dir, { exec })).rejects.toThrow(/permission denied/);\n  });\n\n  it('does not re-init git when .git already exists (idempotent)', async () => {\n    mkdirSync(join(dir, '.git'), { recursive: true });\n    const { exec, calls } = fakeExec();\n\n    await prepareWorkspace(dir, { exec });\n\n    expect(calls).toEqual([]);\n    expect(existsSync(join(dir, '.factory'))).toBe(true);\n  });\n\n  it('does not duplicate the exclude entry on a second run', async () => {\n    const { exec } = fakeExec();\n    await prepareWorkspace(dir, { exec });\n    await prepareWorkspace(dir, { exec });\n\n    const exclude = readFileSync(join(dir, '.git', 'info', 'exclude'), 'utf-8');\n    expect(exclude.match(/\\.factory\\//g)?.length).toBe(1);\n  });\n\n  it('propagates a non-ENOENT error reading the exclude file (e.g. it is a directory)', async () => {\n    mkdirSync(join(dir, '.git', 'info', 'exclude'), { recursive: true });\n    const { exec } = fakeExec();\n\n    await expect(prepareWorkspace(dir, { exec })).rejects.toThrow(/EISDIR|illegal operation/i);\n  });\n\n  it('preserves existing exclude entries and appends a trailing newline', async () => {\n    mkdirSync(join(dir, '.git', 'info'), { recursive: true });\n    writeFileSync(join(dir, '.git', 'info', 'exclude'), 'node_modules/');\n    const { exec } = fakeExec();\n\n    await prepareWorkspace(dir, { exec });\n\n    const exclude = readFileSync(join(dir, '.git', 'info', 'exclude'), 'utf-8');\n    expect(exclude).toBe('node_modules/\\n.factory/\\n');\n  });\n});\n\ndescribe('commitCheckpoint', () => {\n  let dir: string;\n\n  beforeEach(() => {\n    dir = mkdtempSync(join(tmpdir(), 'scbench-workspace-'));\n  });\n\n  afterEach(() => {\n    rmSync(dir, { recursive: true, force: true });\n  });\n\n  it('adds and commits with the checkpoint id in the message', async () => {\n    const calls: string[][] = [];\n    const exec: ExecFn = async (argv) => {\n      calls.push([...argv]);\n      return { exitCode: 0, stdout: '', stderr: '' };\n    };\n\n    await commitCheckpoint(dir, '3', { exec });\n\n    expect(calls[0]).toEqual(['git', 'add', '-A']);\n    expect(calls[1]).toContain('scbench: checkpoint 3');\n  });\n\n  it('tolerates \"nothing to commit\"', async () => {\n    const exec: ExecFn = async (argv) => {\n      if (argv.includes('commit')) return { exitCode: 1, stdout: 'nothing to commit, working tree clean', stderr: '' };\n      return { exitCode: 0, stdout: '', stderr: '' };\n    };\n\n    await expect(commitCheckpoint(dir, '3', { exec })).resolves.toBeUndefined();\n  });\n\n  it('throws AdapterError on any other git failure', async () => {\n    const exec: ExecFn = async (argv) => {\n      if (argv.includes('commit')) return { exitCode: 128, stdout: '', stderr: 'fatal: not a git repository' };\n      return { exitCode: 0, stdout: '', stderr: '' };\n    };\n\n    await expect(commitCheckpoint(dir, '3', { exec })).rejects.toThrow(AdapterError);\n  });\n\n  it('falls back to stdout in the failure message when stderr is empty', async () => {\n    const exec: ExecFn = async (argv) => {\n      if (argv.includes('commit')) return { exitCode: 128, stdout: 'index locked', stderr: '' };\n      return { exitCode: 0, stdout: '', stderr: '' };\n    };\n\n    await expect(commitCheckpoint(dir, '3', { exec })).rejects.toThrow(/index locked/);\n  });\n});\n\ndescribe('createExecaExec', () => {\n  let dir: string;\n\n  beforeEach(() => {\n    dir = mkdtempSync(join(tmpdir(), 'scbench-workspace-'));\n  });\n\n  afterEach(() => {\n    rmSync(dir, { recursive: true, force: true });\n  });\n\n  it('runs a real command and reports its exit code without throwing', async () => {\n    const exec = createExecaExec();\n\n    const ok = await exec([process.execPath, '-e', 'process.stdout.write(\"hi\")'], { cwd: dir });\n    expect(ok).toEqual({ exitCode: 0, stdout: 'hi', stderr: '' });\n\n    const failed = await exec([process.execPath, '-e', 'process.exit(3)'], { cwd: dir });\n    expect(failed.exitCode).toBe(3);\n  });\n\n  it(\"falls back to execa's shortMessage on a spawn failure (missing binary)\", async () => {\n    const exec = createExecaExec();\n\n    const result = await exec(['definitely-not-a-real-binary-xyz'], { cwd: dir });\n\n    expect(result.exitCode).toBe(-1);\n    expect(result.stderr.length).toBeGreaterThan(0);\n  });\n});\n"},"packages/scbench-adapter/src/cli-run.test.ts":{"tests":[{"id":"92","name":"cli-run main prints usage and exits 2 for an unknown/missing subcommand"},{"id":"93","name":"cli-run main exits 2 when required flags are missing"},{"id":"94","name":"cli-run main ignores stray non-flag tokens and a flag immediately followed by another flag"},{"id":"95","name":"cli-run main ignores a dangling flag with no trailing value at the end of argv"},{"id":"96","name":"cli-run main parses flags, reads the task file, and prints the CheckpointResult as JSON on success"},{"id":"97","name":"cli-run main defaults --index to 0 when omitted"},{"id":"98","name":"cli-run main exits 2 when the task file cannot be read"},{"id":"99","name":"cli-run main exits 2 when runCheckpoint throws an AdapterError"},{"id":"100","name":"cli-run main re-throws unexpected (non-AdapterError) errors"},{"id":"101","name":"baseline-report subcommand prints usage and exits 2 when called with no subcommand at all"},{"id":"102","name":"baseline-report subcommand exits 2 when required flags are missing"},{"id":"103","name":"baseline-report subcommand reads the config, collects trials, writes the report, and exits 0 on success"},{"id":"104","name":"baseline-report subcommand renders trials returned by collectBaselineTrials into the written report"},{"id":"105","name":"baseline-report subcommand exits 2 when --config cannot be read"},{"id":"106","name":"baseline-report subcommand exits 2 when the config is structurally invalid"},{"id":"107","name":"baseline-report subcommand exits 2 when collectBaselineTrials throws an AdapterError (invalid manifest under --runs)"},{"id":"108","name":"baseline-report subcommand re-throws unexpected (non-AdapterError) errors from collectBaselineTrials"},{"id":"109","name":"defaultCliDeps logs to console.log/console.error and reads real files"},{"id":"110","name":"defaultCliDeps reads a real baseline config and writes a real report file"}],"source":"import { describe, expect, it, vi } from 'vitest';\n\nimport type { BaselineTrial } from './baseline.js';\nimport { AdapterError, type CheckpointResult } from './checkpoint.js';\nimport { defaultCliDeps, main, type CliDeps } from './cli-run.js';\nimport { minimalManifest } from './manifest-fixture.js';\n\nconst RESULT: CheckpointResult = {\n  outcome: 'ready',\n  workspace: '/tmp/ws',\n  artifactsDir: '/tmp/artifacts/calculator/1',\n  briefPath: '/tmp/artifacts/calculator/1/brief.md',\n  manifestPath: '/tmp/artifacts/calculator/1/manifest.json',\n};\n\nconst VALID_CONFIG_JSON = JSON.stringify({\n  baselineId: 'test-baseline',\n  factory: { repo: 'https://example.com/repo', commit: 'a'.repeat(40), packageVersion: '2.0.0' },\n  scbench: { repo: 'https://example.com/scbench', commit: 'b'.repeat(40), pinnedAt: '2026-07-28' },\n  problemCatalog: {\n    repo: 'https://example.com/problems',\n    version: 'v1.0',\n    commit: 'c'.repeat(40),\n    pinnedAt: '2026-07-29',\n  },\n  modelConfig: { source: 'models.json', env: {} },\n  promptInputs: 'briefs',\n  environment: { node: '>=20', requiredBinaries: [], hostClass: 'test', scbenchHarness: 'python' },\n  problems: { resolvedFrom: 'resolved from the catalog commit', smoke: 'alpha', suite: ['alpha', 'beta', 'gamma'] },\n  trials: { smokeRuns: 2, suiteTrialsPerProblem: 3 },\n  comparisonThreshold: 10,\n  passPolicy: { id: 'core-cases', description: 'Core-group tests must all pass.' },\n});\n\nfunction fakeDeps(overrides: Partial<"+"CliDeps> = {}): CliDeps {\n  return {\n    readTaskFile: vi.fn(async () => 'do the thing'),\n    runCheckpoint: vi.fn(async () => RESULT),\n    readBaselineConfig: vi.fn(async () => VALID_CONFIG_JSON),\n    collectBaselineTrials: vi.fn((): BaselineTrial[] => []),\n    writeReport: vi.fn(async () => undefined),\n    log: vi.fn(),\n    logError: vi.fn(),\n    ...overrides,\n  };\n}\n\ndescribe('cli-run main', () => {\n  it('prints usage and exits 2 for an unknown/missing subcommand', async () => {\n    const deps = fakeDeps();\n\n    const code = await main([], deps);\n\n    expect(code).toBe(2);\n    expect(deps.logError).toHaveBeenCalledWith(expect.stringContaining('usage:'));\n  });\n\n  it('exits 2 when required flags are missing', async () => {\n    const deps = fakeDeps();\n\n    const code = await main(['run-checkpoint', '--workspace', '/tmp/ws'], deps);\n\n    expect(code).toBe(2);\n    expect(deps.logError).toHaveBeenCalledWith(expect.stringContaining('missing required flag'));\n  });\n\n  it('ignores stray non-flag tokens and a flag immediately followed by another flag', async () => {\n    const deps = fakeDeps();\n\n    const code = await main(\n      [\n        'run-checkpoint',\n        'stray-positional',\n        '--index',\n        '--workspace',\n        '/tmp/ws',\n        '--artifacts',\n        '/tmp/artifacts',\n        '--task-file',\n        '/tmp/task.md',\n        '--problem',\n        'calculator',\n        '--checkpoint',\n        '1',\n      ],\n      deps,\n    );\n\n    expect(code).toBe(0);\n    expect(deps.runCheckpoint).toHaveBeenCalledWith(expect.objectContaining({ index: 0 }), {\n      workspace: '/tmp/ws',\n      artifactsRoot: '/tmp/artifacts',\n      factoryBin: undefined,\n    });\n  });\n\n  it('ignores a dangling flag with no trailing value at the end of argv', async () => {\n    const deps = fakeDeps();\n\n    const code = await main(\n      [\n        'run-checkpoint',\n        '--workspace',\n        '/tmp/ws',\n        '--artifacts',\n        '/tmp/artifacts',\n        '--task-file',\n        '/tmp/task.md',\n        '--problem',\n        'calculator',\n        '--checkpoint',\n        '1',\n        '--factory-bin',\n      ],\n      deps,\n    );\n\n    expect(code).toBe(0);\n    expect(deps.runCheckpoint).toHaveBeenCalledWith(expect.anything(), {\n      workspace: '/tmp/ws',\n      artifactsRoot: '/tmp/artifacts',\n      factoryBin: undefined,\n    });\n  });\n\n  it('parses flags, reads the task file, and prints the CheckpointResult as JSON on success', async () => {\n    const deps = fakeDeps();\n\n    const code = await main(\n      [\n        'run-checkpoint',\n        '--workspace',\n        '/tmp/ws',\n        '--artifacts',\n        '/tmp/artifacts',\n        '--task-file',\n        '/tmp/task.md',\n        '--problem',\n        'calculator',\n        '--checkpoint',\n        '1',\n        '--index',\n        '0',\n        '--factory-bin',\n        '/opt/factory',\n      ],\n      deps,\n    );\n\n    expect(code).toBe(0);\n    expect(deps.readTaskFile).toHaveBeenCalledWith('/tmp/task.md');\n    expect(deps.runCheckpoint).toHaveBeenCalledWith(\n      { problemId: 'calculator', checkpointId: '1', index: 0, task: 'do the thing' },\n      { workspace: '/tmp/ws', artifactsRoot: '/tmp/artifacts', factoryBin: '/opt/factory' },\n    );\n    expect(deps.log).toHaveBeenCalledWith(JSON.stringify(RESULT));\n  });\n\n  it('defaults --index to 0 when omitted', async () => {\n    const deps = fakeDeps();\n\n    await main(\n      [\n        'run-checkpoint',\n        '--workspace',\n        '/tmp/ws',\n        '--artifacts',\n        '/tmp/artifacts',\n        '--task-file',\n        '/tmp/task.md',\n        '--problem',\n        'calculator',\n        '--checkpoint',\n        '1',\n      ],\n      deps,\n    );\n\n    expect(deps.runCheckpoint).toHaveBeenCalledWith(expect.objectContaining({ index: 0 }), expect.anything());\n  });\n\n  it('exits 2 when the task file cannot be read', async () => {\n    const deps = fakeDeps({ readTaskFile: vi.fn(async () => Promise.reject(new Error('ENOENT'))) });\n\n    const code = await main(\n      [\n        'run-checkpoint',\n        '--workspace',\n        '/tmp/ws',\n        '--artifacts',\n        '/tmp/artifacts',\n        '--task-file',\n        '/tmp/missing.md',\n        '--problem',\n        'calculator',\n        '--checkpoint',\n        '1',\n      ],\n      deps,\n    );\n\n    expect(code).toBe(2);\n    expect(deps.logError).toHaveBeenCalledWith(expect.stringContaining('ENOENT'));\n  });\n\n  it('exits 2 when runCheckpoint throws an AdapterError', async () => {\n    const deps = fakeDeps({\n      runCheckpoint: vi.fn(async () => {\n        throw new AdapterError('workspace unwritable');\n      }),\n    });\n\n    const code = await main(\n      [\n        'run-checkpoint',\n        '--workspace',\n        '/tmp/ws',\n        '--artifacts',\n        '/tmp/artifacts',\n        '--task-file',\n        '/tmp/task.md',\n        '--problem',\n        'calculator',\n        '--checkpoint',\n        '1',\n      ],\n      deps,\n    );\n\n    expect(code).toBe(2);\n    expect(deps.logError).toHaveBeenCalledWith('workspace unwritable');\n  });\n\n  it('re-throws unexpected (non-AdapterError) errors', async () => {\n    const deps = fakeDeps({\n      runCheckpoint: vi.fn(async () => {\n        throw new Error('boom');\n      }),\n    });\n\n    await expect(\n      main(\n        [\n          'run-checkpoint',\n          '--workspace',\n          '/tmp/ws',\n          '--artifacts',\n          '/tmp/artifacts',\n          '--task-file',\n          '/tmp/task.md',\n          '--problem',\n          'calculator',\n          '--checkpoint',\n          '1',\n        ],\n        deps,\n      ),\n    ).rejects.toThrow('boom');\n  });\n});\n\ndescribe('baseline-report subcommand', () => {\n  it('prints usage and exits 2 when called with no subcommand at all', async () => {\n    const deps = fakeDeps();\n    const code = await main(['baseline-report'], deps);\n    expect(code).toBe(2);\n    expect(deps.logError).toHaveBeenCalledWith(expect.stringContaining('missing required flag'));\n  });\n\n  it('exits 2 when required flags are missing', async () => {\n    const deps = fakeDeps();\n    const code = await main(['baseline-report', '--config', '/tmp/cfg.json'], deps);\n    expect(code).toBe(2);\n    expect(deps.logError).toHaveBeenCalledWith(expect.stringContaining('missing required flag(s): --runs, --out'));\n  });\n\n  it('reads the config, collects trials, writes the report, and exits 0 on success', async () => {\n    const deps = fakeDeps();\n\n    const code = await main(\n      ['baseline-report', '--config', '/tmp/cfg.json', '--runs', '/tmp/runs', '--out', '/tmp/out.md'],\n      deps,\n    );\n\n    expect(code).toBe(0);\n    expect(deps.readBaselineConfig).toHaveBeenCalledWith('/tmp/cfg.json');\n    expect(deps.collectBaselineTrials).toHaveBeenCalledWith('/tmp/runs');\n    expect(deps.writeReport).toHaveBeenCalledWith('/tmp/out.md', expect.stringContaining('test-baseline'));\n    expect(deps.log).toHaveBeenCalledWith('wrote baseline report to /tmp/out.md');\n  });\n\n  it('renders trials returned by collectBaselineTrials into the written report', async () => {\n    const trial: BaselineTrial = {\n      id: 'smoke/trial-1',\n      manifestPath: '/tmp/runs/smoke/trial-1/manifest.json',\n      manifest: minimalManifest(),\n      evidence: { runInfoPresent: false },\n    };\n    const deps = fakeDeps({ collectBaselineTrials: vi.fn(() => [trial]) });\n\n    await main(['baseline-report', '--config', '/tmp/cfg.json', '--runs', '/tmp/runs', '--out', '/tmp/out.md'], deps);\n\n    expect(deps.writeReport).toHaveBeenCalledWith('/tmp/out.md', expect.stringContaining('smoke/trial-1'));\n  });\n\n  it('exits 2 when --config cannot be read', async () => {\n    const deps = fakeDeps({\n      readBaselineConfig: vi.fn(async () => Promise.reject(new Error('ENOENT'))),\n    });\n\n    const code = await main(\n      ['baseline-report', '--config', '/tmp/missing.json', '--runs', '/tmp/runs', '--out', '/tmp/out.md'],\n      deps,\n    );\n\n    expect(code).toBe(2);\n    expect(deps.logError).toHaveBeenCalledWith(expect.stringContaining('ENOENT'));\n  });\n\n  it('exits 2 when the config is structurally invalid', async () => {\n    const deps = fakeDeps({ readBaselineConfig: vi.fn(async () => '{\"not\":\"valid\"}') });\n\n    const code = await main(\n      ['baseline-report', '--config', '/tmp/cfg.json', '--runs', '/tmp/runs', '--out', '/tmp/out.md'],\n      deps,\n    );\n\n    expect(code).toBe(2);\n    expect(deps.logError).toHaveBeenCalledWith(expect.stringContaining('missing required field'));\n  });\n\n  it('exits 2 when collectBaselineTrials throws an AdapterError (invalid manifest under --runs)', async () => {\n    const deps = fakeDeps({\n      collectBaselineTrials: vi.fn(() => {\n        throw new AdapterError('manifest version mismatch');\n      }),\n    });\n\n    const code = await main(\n      ['baseline-report', '--config', '/tmp/cfg.json', '--runs', '/tmp/runs', '--out', '/tmp/out.md'],\n      deps,\n    );\n\n    expect(code).toBe(2);\n    expect(deps.logError).toHaveBeenCalledWith('manifest version mismatch');\n  });\n\n  it('re-throws unexpected (non-AdapterError) errors from collectBaselineTrials', async () => {\n    const deps = fakeDeps({\n      collectBaselineTrials: vi.fn(() => {\n        throw new Error('boom');\n      }),\n    });\n\n    await expect(\n      main(['baseline-report', '--config', '/tmp/cfg.json', '--runs', '/tmp/runs', '--out', '/tmp/out.md'], deps),\n    ).rejects.toThrow('boom');\n  });\n});\n\ndescribe('defaultCliDeps', () => {\n  it('logs to console.log/console.error and reads real files', async () => {\n    const deps = defaultCliDeps();\n    const logSpy = vi.spyOn(console, 'log').mockImplementation(() => {});\n    const errorSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\n    deps.log('hello');\n    deps.logError('oops');\n    expect(logSpy).toHaveBeenCalledWith('hello');\n    expect(errorSpy).toHaveBeenCalledWith('oops');\n\n    await expect(deps.readTaskFile('/definitely/does/not/exist.md')).rejects.toThrow();\n\n    logSpy.mockRestore();\n    errorSpy.mockRestore();\n  });\n\n  it('reads a real baseline config and writes a real report file', async () => {\n    const { mkdtempSync, readFileSync, rmSync } = await import('node:fs');\n    const { tmpdir } = await import('node:os');\n    const { join } = await import('node:path');\n\n    const deps = defaultCliDeps();\n    const dir = mkdtempSync(join(tmpdir(), 'scb-cli-baseline-'));\n    try {\n      const configPath = join(dir, 'cfg.json');\n      const outPath = join(dir, 'out.md');\n      const raw = JSON.stringify({\n        baselineId: 'x',\n        factory: { repo: 'r', commit: 'a'.repeat(40), packageVersion: '1.0.0' },\n        scbench: { repo: 'r', commit: 'b'.repeat(40), pinnedAt: '2026-07-28' },\n        problemCatalog: { repo: 'r', version: 'v1.0', commit: 'c'.repeat(40), pinnedAt: '2026-07-29' },\n        modelConfig: { source: 's', env: {} },\n        promptInputs: 'p',\n        environment: { node: '>=20', requiredBinaries: [], hostClass: 'h', scbenchHarness: 'p' },\n        problems: { resolvedFrom: 's', smoke: 's', suite: ['s'] },\n        trials: { smokeRuns: 1, suiteTrialsPerProblem: 1 },\n        comparisonThreshold: 10,\n      });\n      await deps.writeReport(configPath, raw);\n      expect(await deps.readBaselineConfig(configPath)).toBe(raw);\n      await deps.writeReport(outPath, 'report content');\n      expect(readFileSync(outPath, 'utf-8')).toBe('report content');\n    } finally {\n      rmSync(dir, { recursive: true, force: true });\n    }\n  });\n});\n"},"packages/scbench-adapter/src/cli.test.ts":{"tests":[{"id":"111","name":"cli entrypoint runs main with process.argv and exits with its returned code"},{"id":"112","name":"cli entrypoint prints the error and exits 2 when main rejects"},{"id":"113","name":"cli entrypoint stringifies a non-Error rejection before printing it"}],"source":"import { afterEach, describe, expect, it, vi } from 'vitest';\n\ndescribe('cli entrypoint', () => {\n  afterEach(() => {\n    vi.resetModules();\n    vi.doUnmock('./cli-run.js');\n    vi.restoreAllMocks();\n  });\n\n  it('runs main with process.argv and exits with its returned code', async () => {\n    const main = vi.fn(async () => 0);\n    vi.doMock('./cli-run.js', () => ({ main }));\n    vi.spyOn(process, 'exit').mockImplementation((() => undefined) as never);\n\n    await import('./cli.js');\n    await vi.waitFor(() => expect(process.exit).toHaveBeenCalledWith(0));\n\n    expect(main).toHaveBeenCalledTimes(1);\n  });\n\n  it('prints the error and exits 2 when main rejects', async () => {\n    const main = vi.fn(async () => {\n      throw new Error('entry failed');\n    });\n    vi.doMock('./cli-run.js', () => ({ main }));\n    vi.spyOn(console, 'error').mockImplementation(() => {});\n    vi.spyOn(process, 'exit').mockImplementation((() => undefined) as never);\n\n    await import('./cli.js');\n    await vi.waitFor(() => expect(process.exit).toHaveBeenCalledWith(2));\n\n    expect(console.error).toHaveBeenCalledWith('entry failed');\n  });\n\n  it('stringifies a non-Error rejection before printing it', async () => {\n    const main = vi.fn(async () => {\n      throw 'entry failed as a string';\n    });\n    vi.doMock('./cli-run.js', () => ({ main }));\n    vi.spyOn(console, 'error').mockImplementation(() => {});\n    vi.spyOn(process, 'exit').mockImplementation((() => undefined) as never);\n\n    await import('./cli.js');\n    await vi.waitFor(() => expect(process.exit).toHaveBeenCalledWith(2));\n\n    expect(console.error).toHaveBeenCalledWith('entry failed as a string');\n  });\n});\n"},"packages/scbench-adapter/src/brief.test.ts":{"tests":[{"id":"114","name":"materializeBrief titles the brief with the problem and checkpoint id"},{"id":"115","name":"materializeBrief embeds the task verbatim"},{"id":"116","name":"materializeBrief includes a non-empty acceptance criteria section"},{"id":"117","name":"materializeBrief round-trips through createLocalBriefAdapter (#507 validation)"},{"id":"118","name":"materializeBrief embeds a task that itself contains an H1 without breaking the title"}],"source":"import { createLocalBriefAdapter, type BriefFileReader } from '@on-par/factory-core';\nimport { describe, expect, it } from 'vitest';\n\nimport { materializeBrief } from './brief.js';\nimport type { ScbenchCheckpoint } from './checkpoint.js';\n\nconst CHECKPOINT: ScbenchCheckpoint = {\n  problemId: 'calculator',\n  checkpointId: '2',\n  index: 1,\n  task: 'Add a `subtract` function to calc.py that returns a - b.',\n};\n\ndescribe('materializeBrief', () => {\n  it('titles the brief with the problem and checkpoint id', () => {\n    const brief = materializeBrief(CHECKPOINT);\n    expect(brief).toMatch(/^# SCBench calculator — checkpoint 2\\n/);\n  });\n\n  it('embeds the task verbatim', () => {\n    const brief = materializeBrief(CHECKPOINT);\n    expect(brief).toContain(CHECKPOINT.task);\n  });\n\n  it('includes a non-empty acceptance criteria section', () => {\n    const brief = materializeBrief(CHECKPOINT);\n    expect(brief).toContain('## Acceptance criteria');\n    expect(brief).toContain('- The workspace implements the checkpoint specification above');\n  });\n\n  it('round-trips through createLocalBriefAdapter (#507 validation)', async () => {\n    const brief = materializeBrief(CHECKPOINT);\n    const reader: BriefFileReader = { readFile: async () => brief };\n    const adapter = createLocalBriefAdapter(reader);\n\n    const request = await adapter.resolve({ path: '/tmp/checkpoint.md' });\n\n    expect(request.title).toBe('SCBench calculator — checkpoint 2');\n    expect(request.brief).toContain(CHECKPOINT.task);\n    expect(request.acceptanceCriteria.length).toBeGreaterThanOrEqual(1);\n  });\n\n  it('embeds a task that itself contains an H1 without breaking the title', async () => {\n    const checkpoint: ScbenchCheckpoint = { ...CHECKPOINT, task: '# Not the real title\\n\\nDo the thing.' };\n    const brief = materializeBrief(checkpoint);\n    const reader: BriefFileReader = { readFile: async () => brief };\n    const adapter = createLocalBriefAdapter(reader);\n\n    const request = await adapter.resolve({ path: '/tmp/checkpoint.md' });\n\n    expect(request.title).toBe('SCBench calculator — checkpoint 2');\n    expect(request.brief).toContain('Do the thing.');\n  });\n});\n"},"packages/scbench-adapter/src/invoke.test.ts":{"tests":[{"id":"119","name":"buildRunBriefArgs builds the run-brief argv in order"},{"id":"120","name":"runFactory defaults to the bare \"factory\" binary and runs with cwd = workspace"},{"id":"121","name":"runFactory prefers opts.factoryBin over FACTORY_BIN over the default"},{"id":"122","name":"runFactory surfaces a non-zero exit as a result, not a thrown error"}],"source":"import { afterEach, beforeEach, describe, expect, it } from 'vitest';\n\nimport { buildRunBriefArgs, runFactory } from './invoke.js';\nimport type { ExecFn } from './workspace.js';\n\ndescribe('buildRunBriefArgs', () => {\n  it('builds the run-brief argv in order', () => {\n    const args = buildRunBriefArgs({\n      briefPath: '/artifacts/calculator/1/brief.md',\n      workspace: '/tmp/ws',\n      artifactsDir: '/artifacts/calculator/1',\n    });\n\n    expect(args).toEqual([\n      'run-brief',\n      '/artifacts/calculator/1/brief.md',\n      '--workspace',\n      '/tmp/ws',\n      '--artifacts',\n      '/artifacts/calculator/1',\n    ]);\n  });\n});\n\ndescribe('runFactory', () => {\n  const originalFactoryBin = process.env.FACTORY_BIN;\n\n  beforeEach(() => {\n    delete process.env.FACTORY_BIN;\n  });\n\n  afterEach(() => {\n    if (originalFactoryBin === undefined) delete process.env.FACTORY_BIN;\n    else process.env.FACTORY_BIN = originalFactoryBin;\n  });\n\n  it('defaults to the bare \"factory\" binary and runs with cwd = workspace', async () => {\n    const calls: { argv: readonly string[]; cwd: string }[] = [];\n    const exec: ExecFn = async (argv, opts) => {\n      calls.push({ argv, cwd: opts.cwd });\n      return { exitCode: 0, stdout: '', stderr: '' };\n    };\n\n    await runFactory(['run-brief', 'brief.md'], { cwd: '/tmp/ws' }, { exec });\n\n    expect(calls).toEqual([{ argv: ['factory', 'run-brief', 'brief.md'], cwd: '/tmp/ws' }]);\n  });\n\n  it('prefers opts.factoryBin over FACTORY_BIN over the default', async () => {\n    process.env.FACTORY_BIN = 'factory-from-env';\n    const calls: (readonly string[])[] = [];\n    const exec: ExecFn = async (argv) => {\n      calls.push(argv);\n      return { exitCode: 0, stdout: '', stderr: '' };\n    };\n\n    await runFactory(['run-brief'], { cwd: '/tmp/ws', factoryBin: '/opt/factory' }, { exec });\n    expect(calls[0][0]).toBe('/opt/factory');\n\n    await runFactory(['run-brief'], { cwd: '/tmp/ws' }, { exec });\n    expect(calls[1][0]).toBe('factory-from-env');\n  });\n\n  it('surfaces a non-zero exit as a result, not a thrown error', async () => {\n    const exec: ExecFn = async () => ({ exitCode: 1, stdout: 'out', stderr: 'parked' });\n\n    const result = await runFactory(['run-brief'], { cwd: '/tmp/ws' }, { exec });\n\n    expect(result).toEqual({ exitCode: 1, stdout: 'out', stderr: 'parked' });\n  });\n});\n"},"packages/scbench-adapter/src/index.test.ts":{"tests":[{"id":"123","name":"index exports re-exports the adapter public API"}],"source":"import { describe, expect, it } from 'vitest';\n\nimport * as adapter from './index.js';\n\ndescribe('index exports', () => {\n  it('re-exports the adapter public API', () => {\n    expect(typeof adapter.materializeBrief).toBe('function');\n    expect(typeof adapter.prepareWorkspace).toBe('function');\n    expect(typeof adapter.commitCheckpoint).toBe('function');\n    expect(typeof adapter.buildRunBriefArgs).toBe('function');\n    expect(typeof adapter.runFactory).toBe('function');\n    expect(typeof adapter.collectArtifacts).toBe('function');\n    expect(typeof adapter.runCheckpoint).toBe('function');\n    expect(typeof adapter.createExecaExec).toBe('function');\n    expect(typeof adapter.defaultCliDeps).toBe('function');\n    expect(typeof adapter.runCli).toBe('function');\n    expect(adapter.AdapterError).toBeInstanceOf(Function);\n  });\n});\n"}},"projectRoot":"/Users/moltbot/repos/on-par/software-factory","config":{"$schema":"./node_modules/@stryker-mutator/core/schema/stryker-schema.json","packageManager":"npm","testRunner":"vitest","vitest":{"configFile":"vitest.config.ts","related":true},"reporters":["html","clear-text","progress","json"],"htmlReporter":{"fileName":"reports/mutation/scbench-adapter.html"},"jsonReporter":{"fileName":"reports/mutation/scbench-adapter.json"},"mutate":["packages/scbench-adapter/src/**/*.ts","!packages/scbench-adapter/src/**/*.test.ts","!packages/scbench-adapter/src/manifest-fixture.ts"],"concurrency":6,"timeoutMS":20000,"coverageAnalysis":"perTest","tsconfigFile":"tsconfig.stryker-none.json","allowConsoleColors":true,"checkers":[],"checkerNodeArgs":[],"commandRunner":{"command":"npm test"},"clearTextReporter":{"allowColor":true,"allowEmojis":false,"logTests":true,"maxTestsToLog":3,"reportTests":true,"reportMutants":true,"reportScoreTable":true,"skipFull":false},"dashboard":{"baseUrl":"https://dashboard.stryker-mutator.io/api/reports","reportType":"full"},"dryRunOnly":false,"eventReporter":{"baseDir":"reports/mutation/eve
