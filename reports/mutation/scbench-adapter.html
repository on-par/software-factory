env: Record<"+"string, string> };\n  promptInputs: string;\n  environment: { node: string; requiredBinaries: string[]; hostClass: string; scbenchHarness: string };\n  problems: { resolvedFrom: string; smoke: string; suite: string[] };\n  trials: { smokeRuns: number; suiteTrialsPerProblem: number };\n  comparisonThreshold: number;\n  passPolicy: { id: 'core-cases'; description: string };\n}\n\nconst REQUIRED_KEYS = [\n  'baselineId',\n  'factory',\n  'scbench',\n  'problemCatalog',\n  'modelConfig',\n  'promptInputs',\n  'environment',\n  'problems',\n  'trials',\n  'comparisonThreshold',\n  'passPolicy',\n] as const;\n\nconst FULL_SHA_RE = /^[0-9a-f]{40}$/;\nconst PROBLEM_ID_RE = /^[a-z0-9][a-z0-9_-]*$/;\n\n/** Parse + structurally validate a baseline config: every required\n *  top-level field present, a positive comparisonThreshold, and\n *  full-length git SHAs for factory.commit/scbench.commit. Throws\n *  AdapterError naming the offending field. */\nexport function loadBaselineConfig(raw: string): BaselineConfig {\n  let parsed: unknown;\n  try {\n    parsed = JSON.parse(raw);\n  } catch (err) {\n    throw new AdapterError(`could not parse baseline config: ${(err as Error).message}`);\n  }\n  if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {\n    throw new AdapterError('baseline config must be a JSON object');\n  }\n  const config = parsed as Record<"+"string, unknown>;\n\n  for (const key of REQUIRED_KEYS) {\n    if (!(key in config)) {\n      throw new AdapterError(`baseline config missing required field \"${key}\"`);\n    }\n  }\n  if (typeof config.comparisonThreshold !== 'number' || config.comparisonThreshold <"+"= 0) {\n    throw new AdapterError('baseline config field \"comparisonThreshold\" must be a positive number');\n  }\n\n  const factory = config.factory as { commit?: unknown } | null;\n  if (typeof factory?.commit !== 'string' || !FULL_SHA_RE.test(factory.commit)) {\n    throw new AdapterError('baseline config field \"factory.commit\" must be a full-length (40 hex char) git SHA');\n  }\n  const scbench = config.scbench as { commit?: unknown } | null;\n  if (typeof scbench?.commit !== 'string' || !FULL_SHA_RE.test(scbench.commit)) {\n    throw new AdapterError('baseline config field \"scbench.commit\" must be a full-length (40 hex char) git SHA');\n  }\n\n  const problemCatalog = config.problemCatalog as {\n    repo?: unknown;\n    version?: unknown;\n    commit?: unknown;\n    pinnedAt?: unknown;\n  } | null;\n  if (typeof problemCatalog?.commit !== 'string' || !FULL_SHA_RE.test(problemCatalog.commit)) {\n    throw new AdapterError('baseline config field \"problemCatalog.commit\" must be a full-length (40 hex char) git SHA');\n  }\n  if (typeof problemCatalog.repo !== 'string' || problemCatalog.repo.length === 0) {\n    throw new AdapterError('baseline config field \"problemCatalog.repo\" must be a non-empty string');\n  }\n  if (typeof problemCatalog.version !== 'string' || problemCatalog.version.length === 0) {\n    throw new AdapterError('baseline config field \"problemCatalog.version\" must be a non-empty string');\n  }\n  if (typeof problemCatalog.pinnedAt !== 'string' || problemCatalog.pinnedAt.length === 0) {\n    throw new AdapterError('baseline config field \"problemCatalog.pinnedAt\" must be a non-empty string');\n  }\n\n  const problems = config.problems as { resolvedFrom?: unknown; smoke?: unknown; suite?: unknown } | null;\n  if (typeof problems?.smoke !== 'string' || !PROBLEM_ID_RE.test(problems.smoke)) {\n    throw new AdapterError(\n      'baseline config field \"problems.smoke\" must be an exact problem id from the pinned catalog (a selection rule is not reproducible)',\n    );\n  }\n  if (\n    !Array.isArray(problems.suite) ||\n    problems.suite.length === 0 ||\n    !problems.suite.every((id): id is string => typeof id === 'string' && PROBLEM_ID_RE.test(id)) ||\n    new Set(problems.suite).size !== problems.suite.length\n  ) {\n    throw new AdapterError(\n      'baseline config field \"problems.suite\" must be a non-empty array of unique exact problem ids from the pinned catalog',\n    );\n  }\n  if (typeof problems.resolvedFrom !== 'string' || problems.resolvedFrom.length === 0) {\n    throw new AdapterError('baseline config field \"problems.resolvedFrom\" must be a non-empty string');\n  }\n\n  const passPolicy = config.passPolicy as { id?: unknown; description?: unknown } | null;\n  if (typeof passPolicy !== 'object' || passPolicy === null || passPolicy.id !== 'core-cases') {\n    throw new AdapterError('baseline config field \"passPolicy.id\" must be \"core-cases\" — the only pinned pass policy');\n  }\n  if (typeof passPolicy.description !== 'string' || passPolicy.description.length === 0) {\n    throw new AdapterError('baseline config field \"passPolicy.description\" must be a non-empty string');\n  }\n\n  return config as unknown as BaselineConfig;\n}\n\n/** Parsed subset of SCBench's native per-checkpoint evaluation.json\n *  (CorrectnessResults at the pinned commit). Extra fields are ignored. */\nexport interface ScbenchEvaluation {\n  problem_name: string;\n  checkpoint_name: string;\n  pass_counts: Record<"+"string, number>;\n  total_counts: Record<"+"string, number>;\n  pytest_exit_code: number;\n  infrastructure_failure: boolean;\n}\n\n/** One line of SCBench's run-level checkpoint_results.jsonl. Extra fields\n *  are ignored. */\nexport interface ScbenchRunRecord {\n  problem: string;\n  checkpoint: string;\n  state: string;\n  core_passed: number;\n  core_total: number;\n}\n\n/** Native SCBench evidence found colocated with a trial's manifest.json. */\nexport interface BaselineTrialEvidence {\n  evaluation?: ScbenchEvaluation;\n  runRecords?: ScbenchRunRecord[];\n  runInfoPresent: boolean;\n}\n\nexport type TrialVerdict = 'pass' | 'fail' | 'infrastructure-failure' | 'missing-evidence';\n\nexport interface BaselineTrial {\n  /** Manifest's directory path, relative to the runs root (e.g. \"smoke/trial-1\"). */\n  id: string;\n  manifestPath: string;\n  manifest: BenchmarkManifest;\n  evidence: BaselineTrialEvidence;\n}\n\nexport interface BaselineFsDeps {\n  existsSync: (path: string) => boolean;\n  readdirSync: (dir: string) => Dirent[];\n  readFileSync: (path: string) => string;\n}\n\nconst REAL_FS: BaselineFsDeps = {\n  existsSync,\n  readdirSync: (dir) => readdirSync(dir, { withFileTypes: true }),\n  readFileSync: (path) => readFileSync(path, 'utf-8'),\n};\n\nfunction findManifestPaths(dir: string, deps: BaselineFsDeps): string[] {\n  const found: string[] = [];\n  for (const entry of deps.readdirSync(dir)) {\n    const full = join(dir, entry.name);\n    if (entry.isDirectory()) {\n      found.push(...findManifestPaths(full, deps));\n    } else if (entry.name === 'manifest.json') {\n      found.push(full);\n    }\n  }\n  return found;\n}\n\nfunction toTrialId(runsDir: string, manifestPath: string): string {\n  return relative(runsDir, dirname(manifestPath)).split(sep).join('/');\n}\n\nfunction isPlainObject(value: unknown): value is Record<"+"string, unknown> {\n  return typeof value === 'object' && value !== null && !Array.isArray(value);\n}\n\nfunction isRecordOfNumbers(value: unknown): value is Record<"+"string, number> {\n  return isPlainObject(value) && Object.values(value).every((v) => typeof v === 'number');\n}\n\n/** Parse + structurally validate a single trial's native evaluation.json.\n *  Throws AdapterError naming `path` and the offending field. */\nfunction parseEvaluation(raw: string, path: string): ScbenchEvaluation {\n  let parsed: unknown;\n  try {\n    parsed = JSON.parse(raw);\n  } catch (err) {\n    throw new AdapterError(`could not parse ${path}: ${(err as Error).message}`);\n  }\n  if (!isPlainObject(parsed)) {\n    throw new AdapterError(`invalid evaluation evidence at ${path}: must be a JSON object`);\n  }\n  const invalid = (field: string, expectation: string): never => {\n    throw new AdapterError(`invalid evaluation evidence at ${path}: field \"${field}\" must be ${expectation}`);\n  };\n  if (typeof parsed.problem_name !== 'string' || parsed.problem_name.length === 0) {\n    invalid('problem_name', 'a non-empty string');\n  }\n  if (typeof parsed.checkpoint_name !== 'string' || parsed.checkpoint_name.length === 0) {\n    invalid('checkpoint_name', 'a non-empty string');\n  }\n  if (!isRecordOfNumbers(parsed.pass_counts)) {\n    invalid('pass_counts', 'an object whose values are numbers');\n  }\n  if (!isRecordOfNumbers(parsed.total_counts)) {\n    invalid('total_counts', 'an object whose values are numbers');\n  }\n  if (typeof parsed.pytest_exit_code !== 'number') {\n    invalid('pytest_exit_code', 'a number');\n  }\n  if (typeof parsed.infrastructure_failure !== 'boolean') {\n    invalid('infrastructure_failure', 'a boolean');\n  }\n  return parsed as unknown as ScbenchEvaluation;\n}\n\n/** Parse + structurally validate SCBench's run-level\n *  checkpoint_results.jsonl (one JSON object per non-blank line). Throws\n *  AdapterError naming `path` and the 1-based line number. */\nfunction parseRunRecords(raw: string, path: string): ScbenchRunRecord[] {\n  const invalid = (line: number, field: string, expectation: string): never => {\n    throw new AdapterError(`invalid run record at ${path} line ${line}: field \"${field}\" must be ${expectation}`);\n  };\n  const records: ScbenchRunRecord[] = [];\n  const lines = raw.split('\\n');\n  for (let i = 0; i <"+" lines.length; i += 1) {\n    const line = lines[i];\n    if (line.trim().length === 0) continue;\n    const lineNumber = i + 1;\n    let parsed: unknown;\n    try {\n      parsed = JSON.parse(line);\n    } catch (err) {\n      throw new AdapterError(`could not parse ${path} line ${lineNumber}: ${(err as Error).message}`);\n    }\n    if (!isPlainObject(parsed)) {\n      throw new AdapterError(`invalid run record at ${path} line ${lineNumber}: must be a JSON object`);\n    }\n    if (typeof parsed.problem !== 'string') invalid(lineNumber, 'problem', 'a string');\n    if (typeof parsed.checkpoint !== 'string') invalid(lineNumber, 'checkpoint', 'a string');\n    if (typeof parsed.state !== 'string') invalid(lineNumber, 'state', 'a string');\n    if (typeof parsed.core_passed !== 'number') invalid(lineNumber, 'core_passed', 'a number');\n    if (typeof parsed.core_total !== 'number') invalid(lineNumber, 'core_total', 'a number');\n    records.push(parsed as unknown as ScbenchRunRecord);\n  }\n  return records;\n}\n\n/** Load the native SCBench evidence colocated with a trial's manifest.json,\n *  if present. SCBench writes this evidence after the adapter returns, so\n *  the adapter never produces it — retention is an operator copy step\n *  (see evals/scbench-baseline/README.md). */\nfunction loadEvidence(dir: string, deps: BaselineFsDeps): BaselineTrialEvidence {\n  const [evaluationFile, runRecordsFile, runInfoFile] = NATIVE_EVIDENCE_FILES;\n  const evaluationPath = join(dir, evaluationFile);\n  const runRecordsPath = join(dir, runRecordsFile);\n  const runInfoPath = join(dir, runInfoFile);\n\n  const evaluation = deps.existsSync(evaluationPath)\n    ? parseEvaluation(deps.readFileSync(evaluationPath), evaluationPath)\n    : undefined;\n  const runRecords = deps.existsSync(runRecordsPath)\n    ? parseRunRecords(deps.readFileSync(runRecordsPath), runRecordsPath)\n    : undefined;\n  const runInfoPresent = deps.existsSync(runInfoPath);\n\n  return { evaluation, runRecords, runInfoPresent };\n}\n\n/** Recursively scan `runsDir` for manifest.json files, validate each against\n *  BENCHMARK_MANIFEST_VERSION, and return them sorted by trial id for\n *  deterministic report output. An empty (but existing) directory is valid —\n *  the caller renders \"no trials\" rather than failing. A missing `runsDir`\n *  throws AdapterError instead of letting readdirSync's raw ENOENT escape. */\nexport function collectBaselineTrials(runsDir: string, deps: BaselineFsDeps = REAL_FS): BaselineTrial[] {\n  if (!deps.existsSync(runsDir)) {\n    throw new AdapterError(`no such directory: ${runsDir} — pass an existing --runs directory`);\n  }\n\n  const trials = findManifestPaths(runsDir, deps).map((manifestPath) => {\n    let manifest: BenchmarkManifest;\n    try {\n      manifest = JSON.parse(deps.readFileSync(manifestPath)) as BenchmarkManifest;\n    } catch (err) {\n      throw new AdapterError(`could not parse ${manifestPath}: ${(err as Error).message}`);\n    }\n    if (manifest.manifestVersion !== BENCHMARK_MANIFEST_VERSION) {\n      throw new AdapterError(\n        `manifest version mismatch at ${manifestPath}: expected ${BENCHMARK_MANIFEST_VERSION}, got ${manifest.manifestVersion}`,\n      );\n    }\n    const evidence = loadEvidence(dirname(manifestPath), deps);\n    return { id: toTrialId(runsDir, manifestPath), manifestPath, manifest, evidence };\n  });\n  trials.sort((a, b) => (a.id <"+" b.id ? -1 : a.id > b.id ? 1 : 0));\n  return trials;\n}\n\n/** Core-group pass/total, defaulting an absent 'Core' key to 0 (vacuous\n *  0/0 counts as equal, matching upstream's PassPolicy.CORE_CASES). Single\n *  source of truth so the verdict and every render of it agree. */\nfunction coreCounts(evaluation: ScbenchEvaluation): { passed: number; total: number } {\n  return { passed: evaluation.pass_counts.Core ?? 0, total: evaluation.total_counts.Core ?? 0 };\n}\n\n/** Pinned pass policy 'core-cases' — mirrors upstream PassPolicy.CORE_CASES\n *  at the pinned SCBench commit (pass_counts.Core === total_counts.Core),\n *  fail-closed on missing evidence or infrastructure failure. */\nexport function evaluateTrialVerdict(trial: BaselineTrial): TrialVerdict {\n  const evaluation = trial.evidence.evaluation;\n  if (!evaluation) return 'missing-evidence';\n  if (evaluation.infrastructure_failure) return 'infrastructure-failure';\n  const { passed, total } = coreCounts(evaluation);\n  return passed === total ? 'pass' : 'fail';\n}\n\nfunction formatEnv(env: Record<"+"string, string>): string {\n  return Object.entries(env)\n    .map(([key, value]) => `${key}=${value}`)\n    .join(', ');\n}\n\nfunction formatPassRate(ready: number, total: number): string {\n  if (total === 0) return 'no trials recorded';\n  return `${ready}/${total} (${((ready / total) * 100).toFixed(1)}%)`;\n}\n\nfunction renderPinnedInputs(config: BaselineConfig): string {\n  return [\n    `- Factory: \\`${config.factory.repo}\\` @ \\`${config.factory.commit}\\` (package v${config.factory.packageVersion})`,\n    `- SlopCodeBench: \\`${config.scbench.repo}\\` @ \\`${config.scbench.commit}\\` (pinned ${config.scbench.pinnedAt})`,\n    `- Model config: ${config.modelConfig.source}; env: ${formatEnv(config.modelConfig.env)}`,\n    `- Prompt inputs: ${config.promptInputs}`,\n    `- Environment: node ${config.environment.node}; binaries: ${config.environment.requiredBinaries.join(', ')}; host: ${config.environment.hostClass}; harness: ${config.environment.scbenchHarness}`,\n    `- Problem catalog: \\`${config.problemCatalog.repo}\\` @ \\`${config.problemCatalog.commit}\\` (release ${config.problemCatalog.version}, pinned ${config.problemCatalog.pinnedAt}) — every run sets SCBENCH_PROBLEMS_PATH to a checkout of this revision`,\n    `- Problems: smoke \\`${config.problems.smoke}\\`; suite ${config.problems.suite.map((p) => `\\`${p}\\``).join(', ')} (${config.problems.resolvedFrom})`,\n    `- Trial plan: ${config.trials.smokeRuns} smoke run(s), ${config.trials.suiteTrialsPerProblem} suite trial(s) per problem`,\n    `- Pass policy: \\`${config.passPolicy.id}\\` — ${config.passPolicy.description}`,\n  ].join('\\n');\n}\n\nfunction hasEvaluation(\n  t: BaselineTrial,\n): t is BaselineTrial & { evidence: BaselineTrialEvidence & { evaluation: ScbenchEvaluation } } {\n  return t.evidence.evaluation !== undefined;\n}\n\nfunction evidencePresent(evidence: BaselineTrialEvidence): string {\n  const present = [\n    evidence.evaluation ? NATIVE_EVIDENCE_FILES[0] : undefined,\n    evidence.runRecords ? NATIVE_EVIDENCE_FILES[1] : undefined,\n    evidence.runInfoPresent ? NATIVE_EVIDENCE_FILES[2] : undefined,\n  ].filter((f): f is (typeof NATIVE_EVIDENCE_FILES)[number] => f !== undefined);\n  return present.length > 0 ? present.join(', ') : 'none';\n}\n\nfunction renderTrials(trials: BaselineTrial[]): string {\n  if (trials.length === 0) return 'No trials recorded.';\n  return trials\n    .map(\n      (t) =>\n        `- \\`${t.id}\\`: outcome \\`${t.manifest.run.outcome}\\`, elapsed ${t.manifest.run.elapsedMs}ms, manifest \\`${t.manifestPath}\\`, native evidence: ${evidencePresent(t.evidence)}`,\n    )\n    .join('\\n');\n}\n\nfunction renderFactoryOutcomes(trials: BaselineTrial[]): string {\n  const ready = trials.filter((t) => t.manifest.run.outcome === 'ready').length;\n  if (trials.length === 0) return formatPassRate(ready, trials.length);\n  return `${formatPassRate(ready, trials.length)} of Factory runs ended \\`ready\\`. This is harness health — a \\`ready\\` manifest means the PLAN → BUILD → CHECK pipeline completed, not that SCBench's checkpoint evaluation passed; benchmark correctness above is derived only from native SCBench evidence.`;\n}\n\nfunction renderBenchmarkPassRate(config: BaselineConfig, trials: BaselineTrial[]): string {\n  if (trials.length === 0) return 'no trials recorded';\n\n  const withEvidence = trials.filter(hasEvaluation);\n  if (withEvidence.length === 0) {\n    return `Not measurable — none of the ${trials.length} recorded trial(s) carries native SCBench evaluation evidence (\\`evaluation.json\\`). Factory run outcomes are reported separately under harness health and are never counted as benchmark passes.`;\n  }\n\n  const verdicts = trials.map((t) => ({ trial: t, verdict: evaluateTrialVerdict(t) }));\n  const passes = verdicts.filter((v) => v.verdict === 'pass').length;\n  const fails = verdicts.filter((v) => v.verdict === 'fail').length;\n  const infra = verdicts.filter((v) => v.verdict === 'infrastructure-failure').length;\n  const missing = verdicts.filter((v) => v.verdict === 'missing-evidence').length;\n\n  const lines = verdicts.map(({ trial, verdict }) => {\n    if ((verdict === 'pass' || verdict === 'fail') && hasEvaluation(trial)) {\n      const evaluation = trial.evidence.evaluation;\n      const { passed, total } = coreCounts(evaluation);\n      return `- \\`${trial.id}\\`: ${verdict} — Core ${passed}/${total} (${evaluation.problem_name} / ${evaluation.checkpoint_name})`;\n    }\n    if (verdict === 'infrastructure-failure') {\n      return `- \\`${trial.id}\\`: infrastructure failure — native evaluation reports infrastructure_failure`;\n    }\n    return `- \\`${trial.id}\\`: missing evidence — no evaluation.json in the trial directory`;\n  });\n\n  const headline = `${formatPassRate(passes, trials.length)} under pass policy \\`${config.passPolicy.id}\\` — ${passes} pass, ${fails} fail, ${infra} infrastructure failure, ${missing} missing evidence. A trial without native evaluation evidence never counts as a pass.`;\n\n  return [headline, '', ...lines].join('\\n');\n}\n\nfunction checkpointSortKey(checkpointName: string): { n: number | undefined; name: string } {\n  const match = /(\\d+)$/.exec(checkpointName);\n  return { n: match ? Number(match[1]) : undefined, name: checkpointName };\n}\n\nfunction renderErosion(trials: BaselineTrial[]): string {\n  const withEvidence = trials.filter(hasEvaluation);\n  if (withEvidence.length === 0) {\n    return 'Not yet measurable — requires native SCBench evaluation evidence from the live multi-checkpoint suite run.';\n  }\n\n  const groups = new Map<"+"string, (typeof withEvidence)[number][]>();\n  for (const trial of withEvidence) {\n    const problem = trial.evidence.evaluation.problem_name;\n    const list = groups.get(problem) ?? [];\n    list.push(trial);\n    groups.set(problem, list);\n  }\n\n  return [...groups.keys()]\n    .sort()\n    .map((problem) => {\n      const entries = groups\n        .get(problem)!\n        .slice()\n        .sort((a, b) => {\n          const ak = checkpointSortKey(a.evidence.evaluation.checkpoint_name);\n          const bk = checkpointSortKey(b.evidence.evaluation.checkpoint_name);\n          if (ak.n !== undefined && bk.n !== undefined) {\n            if (ak.n !== bk.n) return ak.n - bk.n;\n          } else if (ak.name !== bk.name) {\n            return ak.name <"+" bk.name ? -1 : 1;\n          }\n          return a.id <"+" b.id ? -1 : a.id > b.id ? 1 : 0;\n        })\n        .map((t) => {\n          const evaluation = t.evidence.evaluation;\n          const verdict = evaluateTrialVerdict(t);\n          const verdictLabel = verdict === 'infrastructure-failure' ? 'infrastructure failure' : verdict;\n          const { passed, total } = coreCounts(evaluation);\n          return `${evaluation.checkpoint_name} \\`${t.id}\\`: ${verdictLabel} (Core ${passed}/${total})`;\n        })\n        .join(', ');\n      return `- ${problem}: ${entries}`;\n    })\n    .join('\\n');\n}\n\nfunction renderElapsed(trials: BaselineTrial[]): string {\n  if (trials.length === 0) return 'No trials recorded.';\n  const total = trials.reduce((sum, t) => sum + t.manifest.run.elapsedMs, 0);\n  const mean = total / trials.length;\n  return `Total elapsed: ${total}ms across ${trials.length} trial(s); mean ${mean.toFixed(1)}ms.`;\n}\n\nfunction renderCost(trials: BaselineTrial[]): string {\n  if (trials.length === 0) return 'No trials recorded.';\n  const totals = trials.reduce(\n    (acc, t) => ({\n      totalUsd: acc.totalUsd + t.manifest.cost.totalUsd,\n      inputTokens: acc.inputTokens + t.manifest.cost.inputTokens,\n      outputTokens: acc.outputTokens + t.manifest.cost.outputTokens,\n    }),\n    { totalUsd: 0, inputTokens: 0, outputTokens: 0 },\n  );\n  return `Total cost: $${totals.totalUsd.toFixed(4)}; input tokens: ${totals.inputTokens}; output tokens: ${totals.outputTokens}.`;\n}\n\nfunction renderRouting(trials: BaselineTrial[]): string {\n  const attempts = trials.flatMap((t) => t.manifest.modelAttempts);\n  if (attempts.length === 0) return 'No routing or failover events recorded.';\n  const byKey = new Map<"+"string, { count: number; reasons: Set<"+"string> }>();\n  for (const attempt of attempts) {\n    const key = `${attempt.model} / ${attempt.task}`;\n    const entry = byKey.get(key) ?? { count: 0, reasons: new Set<"+"string>() };\n    entry.count += 1;\n    if (attempt.reason) entry.reasons.add(attempt.reason);\n    byKey.set(key, entry);\n  }\n  return [...byKey.entries()]\n    .sort(([a], [b]) => (a <"+" b ? -1 : a > b ? 1 : 0))\n    .map(([key, entry]) => {\n      const reasons = entry.reasons.size > 0 ? `; failover reasons: ${[...entry.reasons].sort().join(', ')}` : '';\n      return `- ${key}: ${entry.count} attempt(s)${reasons}`;\n    })\n    .join('\\n');\n}\n\nfunction renderCheckerOutcomes(trials: BaselineTrial[]): string {\n  if (trials.length === 0) return 'No trials recorded.';\n  return trials\n    .map((t) => {\n      const checker = t.manifest.checker;\n      if (!checker) return `- \\`${t.id}\\`: No checker data (run ended before CHECK or checker summary absent).`;\n      return `- \\`${t.id}\\`: ${checker.passes} passed, ${checker.failures} failed, ${checker.skips} skipped (total ${checker.total}).`;\n    })\n    .join('\\n');\n}\n\nfunction renderFailureNotes(trials: BaselineTrial[]): string {\n  const withFailures = trials.filter((t) => t.manifest.failure);\n  if (withFailures.length === 0) return 'No failures recorded.';\n  return withFailures\n    .map((t) => {\n      const failure = t.manifest.failure!;\n      return `- \\`${t.id}\\`: phase \\`${failure.phase}\\`, reason \\`${failure.reason}\\` — ${failure.message}`;\n    })\n    .join('\\n');\n}\n\n/** Pure string builder — every rendered value is derived from `config` and\n *  `trials[].manifest`, never from wall-clock state or transcribed logs. */\nexport function generateBaselineReport(config: BaselineConfig, trials: BaselineTrial[]): string {\n  const statusLines = [`**Trial c gs['--checkpoint'],\n    index: flags['--index'] !== undefined ? Number(flags['--index']) : 0,\n    task,\n  };\n\n  try {\n    const result = await deps.runCheckpoint(checkpoint, {\n      workspace: flags['--workspace'],\n      artifactsRoot: flags['--artifacts'],\n      factoryBin: flags['--factory-bin'],\n    });\n    deps.log(JSON.stringify(result));\n    return 0;\n  } catch (err) {\n    if (err instanceof AdapterError) {\n      deps.logError(err.message);\n      return 2;\n    }\n    throw err;\n  }\n}\n\n/** Reads --config, collects trial manifests from --runs, regenerates the\n *  baseline report, and writes it to --out. The report derives only from\n *  the config + committed manifests — never hand-transcribed values or\n *  wall-clock state — so re-running this is how a caller proves the\n *  committed report.md hasn't drifted. */\nasync function runBaselineReport(rest: readonly string[], deps: CliDeps): Promise<"+"number> {\n  const flags = parseFlags(rest);\n  const missing = BASELINE_REPORT_REQUIRED_FLAGS.filter((flag) => flags[flag] === undefined);\n  if (missing.length > 0) {\n    deps.logError(`missing required flag(s): ${missing.join(', ')}\\n${BASELINE_REPORT_USAGE}`);\n    return 2;\n  }\n\n  let raw: string;\n  try {\n    raw = await deps.readBaselineConfig(flags['--config']);\n  } catch (err) {\n    deps.logError(`could not read --config ${flags['--config']}: ${(err as Error).message}`);\n    return 2;\n  }\n\n  try {\n    const config = loadBaselineConfig(raw);\n    const trials = deps.collectBaselineTrials(flags['--runs']);\n    const report = generateBaselineReport(config, trials);\n    await deps.writeReport(flags['--out'], report);\n    deps.log(`wrote baseline report to ${flags['--out']}`);\n    return 0;\n  } catch (err) {\n    if (err instanceof AdapterError) {\n      deps.logError(err.message);\n      return 2;\n    }\n    throw err;\n  }\n}\n\n/** Hand-rolled argv parsing + dispatch across the `run-checkpoint` and\n *  `baseline-report eply equal [ { argv: [ 'factory', …(2) ], …(1) } ]","status":"Killed","static":false,"testsCompleted":1,"killedBy":["120"],"coveredBy":["120","122"],"location":{"end":{"column":70,"line":30},"start":{"column":61,"line":30}}},{"id":"923","mutatorName":"StringLiteral","replacement":"\"\"","statusReason":"expected [ 'run-brief', …(5) ] to deeply equal [ 'run-brief', …(5) ]","status":"Killed","static":false,"testsCompleted":9,"killedBy":["119"],"coveredBy":["8","9","10","11","12","13","14","78","119"],"location":{"end":{"column":53,"line":12},"start":{"column":40,"line":12}}},{"id":"930","mutatorName":"ObjectLiteral","replacement":"{}","statusReason":"expected [ { argv: [ 'factory', …(2) ], …(1) } ] to deeply equal [ { argv: [ 'factory', …(2) ], …(1) } ]","status":"Killed","static":false,"testsCompleted":1,"killedBy":["120"],"coveredBy":["8","9","10","11","12","13","14","78","120","121","122"],"location":{"end":{"column":53,"line":31},"start":{"column":36,"line":31}}},{"id":"924","mutatorName":"StringLiteral","replacement":"\"\"","statusReason":"expected [ 'run-brief', …(5) ] to deeply equal [ 'run-brief', …(5) ]","status":"Killed","static":false,"testsCompleted":9,"killedBy":["119"],"coveredBy":["8","9","10","11","12","13","14","78","119"],"location":{"end":{"column":84,"line":12},"start":{"column":71,"line":12}}},{"id":"925","mutatorName":"BlockStatement","replacement":"{}","statusReason":"Cannot read properties of undefined (reading 'exitCode')","status":"Killed","static":false,"testsCompleted":1,"killedBy":["78"],"coveredBy":["8","9","10","11","12","13","14","78","120","121","122"],"location":{"end":{"column":2,"line":32},"start":{"column":24,"line":29}}},{"id":"927","mutatorName":"LogicalOperator","replacement":"opts.factoryBin && process.env.FACTORY_BIN","statusReason":"unexpected command: factory run-brief /Users/moltbot/.openclaw/tmp/scbench-run-artifacts-CnFqA2/calculator/1/brief.md --workspace /Users/moltbot/.openclaw/tmp/scbench-run-ws-9vb3X1 --artifacts /Users/moltbot/.openclaw/tmp/scbench-run-artifacts-CnFqA2/calculator/1","status":"Killed","static":false,"testsCompleted":1,"killedBy":["8"],"coveredBy":["8","9","10","11","12","13","14","78","120","121","122"],"location":{"end":{"column":57,"line":30},"start":{"column":15,"line":30}}},{"id":"929","mutatorName":"ArrayDeclaration","replacement":"[]","statusReason":"unexpected command: ","status":"Killed","static":false,"testsCompleted":1,"killedBy":["78"],"coveredBy":["8","9","10","11","12","13","14","78","120","121","122"],"location":{"end":{"column":34,"line":31},"start":{"column":20,"line":31}}}],"source":"// packages/scbench-adapter/src/invoke.ts — factory run-brief argv + invocation (#510).\nimport type { ExecFn, ExecResult } from './workspace.js';\n\nexport interface BuildRunBriefArgsOptions {\n  briefPath: string;\n  workspace: string;\n  artifactsDir: string;\n}\n\n/** Pure argv builder for `factory run-brief <"+"brief> --workspace <"+"ws> --artifacts <"+"dir>`. */\nexport function buildRunBriefArgs(opts: BuildRunBriefArgsOptions): string[] {\n  return ['run-brief', opts.briefPath, '--workspace', opts.workspace, '--artifacts', opts.artifactsDir];\n}\n\nexport interface RunFactoryOptions {\n  cwd: string;\n  factoryBin?: string;\n}\n\n/** Runs `factory` with the given args in the SCBench workspace. Resolves the\n *  binary from opts.factoryBin, then FACTORY_BIN, then the bare \"factory\"\n *  name on PATH. A non-zero exit is NOT an adapter error — a failed/parked\n *  Factory run still emits a manifest for the caller to inspect. Environment\n *  passes through untouched; the adapter never forces a model policy. */\nexport async function runFactory(\n  args: readonly string[],\n  opts: RunFactoryOptions,\n  deps: { exec: ExecFn },\n): Promise<"+"ExecResult> {\n  const bin = opts.factoryBin ?? process.env.FACTORY_BIN ?? 'factory';\n  return deps.exec([bin, ...args], { cwd: opts.cwd });\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":80,"low":60,"break":null},"testFiles":{"packages/scbench-adapter/src/artifacts.test.ts":{"tests":[{"id":"0","name":"collectArtifacts copies the four fixed artifact files and returns the parsed manifest"},{"id":"1","name":"collectArtifacts copies optional report and spec when the manifest references them"},{"id":"2","name":"collectArtifacts skips absent optional report/spec without failing"},{"id":"3","name":"collectArtifacts throws AdapterError when manifest.json is missing"},{"id":"4","name":"collectArtifacts throws AdapterError when manifest.json is unparsable"},{"id":"5","name":"collectArtifacts throws AdapterError on a manifestVersion mismatch"},{"id":"6","name":"collectArtifacts skips copying (validate-only) when artifactsDir and dest are the same directory"}],"source":"import { mkdtempSync, readFileSync, rmSync, writeFileSync } from 'node:fs';\nimport { tmpdir } from 'node:os';\nimport { join } from 'node:path';\n\nimport type { BenchmarkManifest } from '@on-par/factory-core';\nimport { afterEach, beforeEach, describe, expect, it } from 'vitest';\n\nimport { collectArtifacts } from './artifacts.js';\nimport { AdapterError } from './checkpoint.js';\nimport { minimalManifest } from './manifest-fixture.js';\n\nfunction writeFixedArtifacts(dir: string, manifest: BenchmarkManifest) {\n  writeFileSync(join(dir, 'manifest.json'), JSON.stringify(manifest));\n  writeFileSync(join(dir, 'request.json'), '{}');\n  writeFileSync(join(dir, 'events.ndjson'), '');\n  writeFileSync(join(dir, 'diff.patch'), '');\n}\n\ndescribe('collectArtifacts', () => {\n  let artifactsDir: string;\n  let dest: string;\n\n  beforeEach(() => {\n    artifactsDir = mkdtempSync(join(tmpdir(), 'scbench-artifacts-src-'));\n    dest = mkdtempSync(join(tmpdir(), 'scbench-artifacts-dest-'));\n  });\n\n  afterEach(() => {\n    rmSync(artifactsDir, { recursive: true, force: true });\n    rmSync(dest, { recursive: true, force: true });\n  });\n\n  it('copies the four fixed artifact files and returns the parsed manifest', () => {\n    const manifest = minimalManifest();\n    writeFixedArtifacts(artifactsDir, manifest);\n\n    const result = collectArtifacts({ artifactsDir, dest });\n\n    expect(result.manifest.run.outcome).toBe('ready');\n    expect(result.copied.sort()).toEqual(['diff.patch', 'events.ndjson', 'manifest.json', 'request.json']);\n    expect(readFileSync(join(dest, 'manifest.json'), 'utf-8')).toContain('\"outcome\":\"ready\"');\n  });\n\n  it('copies optional report and spec when the manifest references them', () => {\n    const reportPath = join(artifactsDir, 'source-report.md');\n    const specPath = join(artifactsDir, 'source-spec.md');\n    writeFileSync(reportPath, '# report');\n    writeFileSync(specPath, '# spec');\n    const manifest = minimalManifest({\n      artifacts: {\n        manifest: 'manifest.json',\n        request: 'request.json',\n        events: 'events.ndjson',\n        diff: 'diff.patch',\n        report: reportPath,\n        spec: specPath,\n      },\n    });\n    writeFixedArtifacts(artifactsDir, manifest);\n\n    const result = collectArtifacts({ artifactsDir, dest });\n\n    expect(result.copied).toContain('report.md');\n    expect(result.copied).toContain('spec.md');\n    expect(readFileSync(join(dest, 'report.md'), 'utf-8')).toBe('# report');\n  });\n\n  it('skips absent optional report/spec without failing', () => {\n    const manifest = minimalManifest({\n      artifacts: {\n        manifest: 'manifest.json',\n        request: 'request.json',\n        events: 'events.ndjson',\n        diff: 'diff.patch',\n        report: join(artifactsDir, 'missing-report.md'),\n      },\n    });\n    writeFixedArtifacts(artifactsDir, manifest);\n\n    const result = collectArtifacts({ artifactsDir, dest });\n\n    expect(result.copied).not.toContain('report.md');\n  });\n\n  it('throws AdapterError when manifest.json is missing', () => {\n    expect(() => collectArtifacts({ artifactsDir, dest })).toThrow(AdapterError);\n  });\n\n  it('throws AdapterError when manifest.json is unparsable', () => {\n    writeFileSync(join(artifactsDir, 'manifest.json'), '{not json');\n\n    expect(() => collectArtifacts({ artifactsDir, dest })).toThrow(AdapterError);\n  });\n\n  it('throws AdapterError on a manifestVersion mismatch', () => {\n    const manifest = minimalManifest({ manifestVersion: 999 });\n    writeFixedArtifacts(artifactsDir, manifest);\n\n    expect(() => collectArtifacts({ artifactsDir, dest })).toThrow(/manifest version mismatch/);\n  });\n\n  it('skips copying (validate-only) when artifactsDir and dest are the same directory', () => {\n    const manifest = minimalManifest();\n    writeFixedArtifacts(artifactsDir, manifest);\n\n    const result = collectArtifacts({ artifactsDir, dest: artifactsDir });\n\n    expect(result.copied).toEqual([]);\n    expect(result.manifest.run.outcome).toBe('ready');\n  });\n});\n"},"packages/scbench-adapter/src/checkpoint.test.ts":{"tests":[{"id":"7","name":"AdapterError sets its name and carries the message"}],"source":"import { describe, expect, it } from 'vitest';\n\nimport { AdapterError } from './checkpoint.js';\n\ndescribe('AdapterError', () => {\n  it('sets its name and carries the message', () => {\n    const err = new AdapterError('boom');\n    expect(err.name).toBe('AdapterError');\n    expect(err.message).toBe('boom');\n    expect(err).toBeInstanceOf(Error);\n  });\n});\n"},"packages/scbench-adapter/src/run-checkpoint.test.ts":{"tests":[{"id":"8","name":"runCheckpoint (2-checkpoint smoke) reuses the workspace across checkpoints and writes isolated artifacts"},{"id":"9","name":"runCheckpoint (2-checkpoint smoke) returns outcome \"error\" (not a throw) when Factory crashes before writing a manifest"},{"id":"10","name":"runCheckpoint (2-checkpoint smoke) keeps an already-successful result when the post-run commit fails"},{"id":"11","name":"runCheckpoint (2-checkpoint smoke) omits the factory-exit detail when factory exited 0 but still wrote no manifest"},{"id":"12","name":"runCheckpoint (2-checkpoint smoke) falls back to factory stdout, then a fixed placeholder, when stderr is empty"},{"id":"13","name":"runCheckpoint (2-checkpoint smoke) falls back to a fixed placeholder when factory produced no output at all"},{"id":"14","name":"runCheckpoint (2-checkpoint smoke) appends a commit failure to an already-present adapter-error detail"}],"source":"import { existsSync, mkdirSync, mkdtempSync, readFileSync, rmSync, writeFileSync } from 'node:fs';\nimport { tmpdir } from 'node:os';\nimport { join } from 'node:path';\n\nimport { afterEach, beforeEach, describe, expect, it } from 'vitest';\n\nimport type { ScbenchCheckpoint } from './checkpoint.js';\nimport { minimalManifest } from './manifest-fixture.js';\nimport { runCheckpoint } from './run-checkpoint.js';\nimport { createExecaExec, type ExecFn } from './workspace.js';\n\nfunction writeFactoryArtifacts(dir: string) {\n  mkdirSync(dir, { recursive: true });\n  writeFileSync(join(dir, 'manifest.json'), JSON.stringify(minimalManifest()));\n  writeFileSync(join(dir, 'request.json'), '{}');\n  writeFileSync(join(dir, 'events.ndjson'), '');\n  writeFileSync(join(dir, 'diff.patch'), '');\n}\n\ndescribe('runCheckpoint (2-checkpoint smoke)', () => {\n  let workspace: string;\n  let artifactsRoot: string;\n  const realExec = createExecaExec();\n\n  beforeEach(() => {\n    workspace = mkdtempSync(join(tmpdir(), 'scbench-run-ws-'));\n    artifactsRoot = mkdtempSync(join(tmpdir(), 'scbench-run-artifacts-'));\n  });\n\n  afterEach(() => {\n    rmSync(workspace, { recursive: true, force: true });\n    rmSync(artifactsRoot, { recursive: true, force: true });\n  });\n\n  it('reuses the workspace across checkpoints and writes isolated artifacts', async () => {\n    const commandLog: string[][] = [];\n    const workspaceCwds: string[] = [];\n\n    const exec: ExecFn = async (argv, opts) => {\n      commandLog.push([...argv]);\n      const [bin, ...rest] = argv;\n\n      if (bin === 'git') return realExec(argv, opts);\n\n      if (bin === 'stub-factory') {\n        workspaceCwds.push(opts.cwd);\n        // rest === ['run-brief', briefPath, '--workspace', ws, '--artifacts', artifactsDir]\n        const artifactsDir = rest[5];\n        if (artifactsDir.endsWith(join('calculator', '1'))) {\n          expect(existsSync(join(workspace, 'calc.py'))).toBe(false);\n          writeFileSync(join(workspace, 'calc.py'), 'def add(a, b):\\n    return a + b\\n');\n        } else {\n          expect(existsSync(join(workspace, 'calc.py'))).toBe(true);\n          const existing = readFileSync(join(workspace, 'calc.py'), 'utf-8');\n          writeFileSync(join(workspace, 'calc.py'), `${existing}\\n\\ndef subtract(a, b):\\n    return a - b\\n`);\n        }\n        writeFactoryArtifacts(artifactsDir);\n        return { exitCode: 0, stdout: '', stderr: '' };\n      }\n\n      throw new Error(`unexpected command: ${argv.join(' ')}`);\n    };\n\n    const checkpoints: ScbenchCheckpoint[] = [\n      { problemId: 'calculator', checkpointId: '1', index: 0, task: 'Add calc.py with an `add` function.' },\n      { problemId: 'calculator', checkpointId: '2', index: 1, task: 'Add a `subtract` function to calc.py.' },\n    ];\n\n    const results = [];\n    for (const checkpoint of checkpoints) {\n      results.push(await runCheckpoint(checkpoint, { workspace, artifactsRoot, factoryBin: 'stub-factory' }, { exec }));\n    }\n\n    expect(results.map((r) => r.outcome)).toEqual(['ready', 'ready']);\n\n    // Both checkpoints ran factory in the same persistent workspace.\n    expect(new Set(workspaceCwds)).toEqual(new Set([workspace]));\n\n    // Per-checkpoint artifact dirs each hold the four fixed files.\n    for (const checkpointId of ['1', '2']) {\n      const dir = join(artifactsRoot, 'calculator', checkpointId);\n      for (const file of ['manifest.json', 'request.json', 'events.ndjson', 'diff.patch']) {\n        expect(existsSync(join(dir, file))).toBe(true);\n      }\n    }\n\n    // Briefs live under the artifacts root, never inside the workspace.\n    expect(existsSync(join(artifactsRoot, 'calculator', '1', 'brief.md'))).toBe(true);\n    expect(existsSync(join(artifactsRoot, 'calculator', '2', 'brief.md'))).toBe(true);\n    expect(existsSync(join(workspace, 'brief.md'))).toBe(false);\n\n    // Workspace reuse: checkpoint 2 saw checkpoint 1's edits.\n    const finalCalc = readFileSync(join(workspace, 'calc.py'), 'utf-8');\n    expect(finalCalc).toContain('def add');\n    expect(finalCalc).toContain('def subtract');\n\n    // One commit per checkpoint, in order.\n    const log = await realExec(['git', 'log', '--format=%s'], { cwd: workspace });\n    const messages = log.stdout.trim().split('\\n');\n    expect(messages).toContain('scbench: checkpoint 1');\n    expect(messages).toContain('scbench: checkpoint 2');\n\n    // No command besides git/stub-factory ever ran — no GitHub, queue, or PR side effects possible.\n    expect(commandLog.every((argv) => argv[0] === 'git' || argv[0] === 'stub-factory')).toBe(true);\n  });\n\n  it('returns outcome \"error\" (not a throw) when Factory crashes before writing a manifest', async () => {\n    const exec: ExecFn = async (argv, opts) => {\n      const [bin] = argv;\n      if (bin === 'git') return realExec(argv, opts);\n      if (bin === 'stub-factory') {\n        // Simulate a crash that still left a partial edit behind, so the\n        // post-failure commitCheckpoint call has something to commit.\n        writeFileSync(join(workspace, 'partial.py'), '# crashed mid-write\\n');\n        return { exitCode: 1, stdout: '', stderr: 'crashed before manifest' };\n      }\n      throw new Error(`unexpected command: ${argv.join(' ')}`);\n    };\n\n    const checkpoint: ScbenchCheckpoint = { problemId: 'calculator', checkpointId: '1', index: 0, task: 'Do it.' };\n\n    const result = await runCheckpoint(checkpoint, { workspace, artifactsRoot, factoryBin: 'stub-factory' }, { exec });\n\n    expect(result.outcome).toBe('error');\n    expect(result.detail).toMatch(/no manifest\\.json found/);\n    // The underlying factory process's own stderr is folded in, not dropped.\n    expect(result.detail).toMatch(/factory exited 1: crashed before manifest/);\n\n    // The workspace still gets committed even on an adapter-level failure.\n    const log = await realExec(['git', 'log', '--format=%s'], { cwd: workspace });\n    expect(log.stdout).toContain('scbench: checkpoint 1');\n  });\n\n  it('keeps an already-successful result when the post-run commit fails', async () => {\n    const exec: ExecFn = async (argv, opts) => {\n      const [bin, ...rest] = argv;\n      if (bin === 'git') {\n        const isCheckpointCommit = rest.includes('commit') && rest.some((a) => a.includes('scbench: checkpoint'));\n        if (isCheckpointCommit) return { exitCode: 1, stdout: '', stderr: 'fatal: unable to write new_index file' };\n        return realExec(argv, opts);\n      }\n      if (bin === 'stub-factory') {\n        writeFactoryArtifacts(rest[5]);\n        return { exitCode: 0, stdout: '', stderr: '' };\n      }\n      throw new Error(`unexpected command: ${argv.join(' ')}`);\n    };\n\n    const checkpoint: ScbenchCheckpoint = { problemId: 'calculator', checkpointId: '1', index: 0, task: 'Do it.' };\n\n    const result = await runCheckpoint(checkpoint, { workspace, artifactsRoot, factoryBin: 'stub-factory' }, { exec });\n\n    // The successful Factory outcome must not be discarded by a bookkeeping\n    // (git commit) failure that happens after the run already succeeded.\n    expect(result.outcome).toBe('ready');\n    expect(result.detail).toMatch(/workspace commit failed/);\n  });\n\n  it('omits the factory-exit detail when factory exited 0 but still wrote no manifest', async () => {\n    const exec: ExecFn = async (argv, opts) => {\n      const [bin] = argv;\n      if (bin === 'git') return realExec(argv, opts);\n      if (bin === 'stub-factory') return { exitCode: 0, stdout: '', stderr: '' };\n      throw new Error(`unexpected command: ${argv.join(' ')}`);\n    };\n\n    const checkpoint: ScbenchCheckpoint = { problemId: 'calculator', checkpointId: '1', index: 0, task: 'Do it.' };\n\n    const result = await runCheckpoint(checkpoint, { workspace, artifactsRoot, factoryBin: 'stub-factory' }, { exec });\n\n    expect(result.outcome).toBe('error');\n    expect(result.detail).toBe(\n      'no manifest.json found at ' + join(artifactsRoot, 'calculator', '1') + ' — Factory did not complete a run',\n    );\n  });\n\n  it('falls back to factory stdout, then a fixed placeholder, when stderr is empty', async () => {\n    const exec: ExecFn = async (argv, opts) => {\n      const [bin] = argv;\n      if (bin === 'git') return realExec(argv, opts);\n      if (bin === 'stub-factory') return { exitCode: 1, stdout: 'factory stdout only', stderr: '' };\n      throw new Error(`unexpected command: ${argv.join(' ')}`);\n    };\n    const checkpoint: ScbenchCheckpoint = { problemId: 'calculator', checkpointId: '1', index: 0, task: 'Do it.' };\n\n    const result = await runCheckpoint(checkpoint, { workspace, artifactsRoot, factoryBin: 'stub-factory' }, { exec });\n    expect(result.detail).toMatch(/factory exited 1: factory stdout only/);\n  });\n\n  it('falls back to a fixed placeholder when factory produced no output at all', async () => {\n    const exec: ExecFn = async (argv, opts) => {\n      const [bin] = argv;\n      if (bin === 'git') return realExec(argv, opts);\n      if (bin === 'stub-factory') return { exitCode: 1, stdout: '', stderr: '' };\n      throw new Error(`unexpected command: ${argv.join(' ')}`);\n    };\n    const checkpoint: ScbenchCheckpoint = { problemId: 'calculator', checkpointId: '1', index: 0, task: 'Do it.' };\n\n    const result = await runCheckpoint(checkpoint, { workspace, artifactsRoot, factoryBin: 'stub-factory' }, { exec });\n    expect(result.detail).toMatch(/factory exited 1: no output/);\n  });\n\n  it('appends a commit failure to an already-present adapter-error detail', async () => {\n    const exec: ExecFn = async (argv, opts) => {\n      const [bin, ...rest] = argv;\n      if (bin === 'git') {\n        const isCheckpointCommit = rest.includes('commit') && rest.some((a) => a.includes('scbench: checkpoint'));\n        if (isCheckpointCommit) return { exitCode: 1, stdout: '', stderr: 'fatal: unable to write new_index file' };\n        return realExec(argv, opts);\n      }\n      if (bin === 'stub-factory') return { exitCode: 1, stdout: '', stderr: 'boom' };\n      throw new Error(`unexpected command: ${argv.join(' ')}`);\n    };\n\n    const checkpoint: ScbenchCheckpoint = { problemId: 'calculator', checkpointId: '1', index: 0, task: 'Do it.' };\n\n    const result = await runCheckpoint(checkpoint, { workspace, artifactsRoot, factoryBin: 'stub-factory' }, { exec });\n\n    expect(result.outcome).toBe('error');\n    expect(result.detail).toMatch(/no manifest\\.json found/);\n    expect(result.detail).toMatch(/; workspace commit failed/);\n  });\n});\n"},"packages/scbench-adapter/src/baseline.test.ts":{"tests":[{"id":"15","name":"loadBaselineConfig accepts the committed baseline config"},{"id":"16","name":"loadBaselineConfig accepts a well-formed synthetic config"},{"id":"17","name":"loadBaselineConfig rejects unparsable JSON"},{"id":"18","name":"loadBaselineConfig rejects a non-object JSON value"},{"id":"19","name":"loadBaselineConfig rejects a config missing a required top-level key"},{"id":"20","name":"loadBaselineConfig rejects a non-positive comparisonThreshold"},{"id":"21","name":"loadBaselineConfig rejects a malformed factory.commit"},{"id":"22","name":"loadBaselineConfig rejects a malformed scbench.commit"},{"id":"23","name":"loadBaselineConfig rejects a config missing passPolicy"},{"id":"24","name":"loadBaselineConfig rejects a passPolicy.id other than \"core-cases\""},{"id":"25","name":"loadBaselineConfig rejects a missing or empty passPolicy.description"},{"id":"26","name":"loadBaselineConfig rejects a malformed problemCatalog.commit"},{"id":"27","name":"loadBaselineConfig rejects an empty problemCatalog.version"},{"id":"28","name":"loadBaselineConfig rejects problems.smoke as a prose selection rule instead of an exact id"},{"id":"29","name":"loadBaselineConfig rejects problems.suite as a string instead of an array"},{"id":"30","name":"loadBaselineConfig rejects an empty problems.suite array"},{"id":"31","name":"loadBaselineConfig rejects duplicate ids in problems.suite"},{"id":"32","name":"loadBaselineConfig rejects an empty problems.resolvedFrom"},{"id":"33","name":"baseline.config.json pin-drift guard matches the committed scbench.pin.json exactly and pins a full-length factory commit SHA"},{"id":"34","name":"collectBaselineTrials recursively finds manifests, sorts by id, and returns [] for an empty dir"},{"id":"35","name":"collectBaselineTrials returns [] for an empty directory"},{"id":"36","name":"collectBaselineTrials rejects a missing --runs directory with an AdapterError instead of a raw ENOENT"},{"id":"37","name":"collectBaselineTrials rejects a manifest with the wrong manifestVersion"},{"id":"38","name":"collectBaselineTrials wraps an unparsable manifest in an AdapterError"},{"id":"39","name":"collectBaselineTrials loads all three native evidence files when present"},{"id":"40","name":"collectBaselineTrials records no evidence when none of the three files are present"},{"id":"41","name":"collectBaselineTrials wraps an unparsable evaluation.json in an AdapterError naming the path"},{"id":"42","name":"collectBaselineTrials rejects a valid-JSON evaluation.json that is not an object"},{"id":"43","name":"collectBaselineTrials rejects evaluation.json with a missing/empty problem_name"},{"id":"44","name":"collectBaselineTrials rejects evaluation.json with a missing/empty checkpoint_name"},{"id":"45","name":"collectBaselineTrials rejects evaluation.json with a non-boolean infrastructure_failure"},{"id":"46","name":"collectBaselineTrials rejects evaluation.json with a non-numeric pass_counts value"},{"id":"47","name":"collectBaselineTrials rejects evaluation.json with a non-numeric total_counts value"},{"id":"48","name":"collectBaselineTrials rejects evaluation.json with a non-numeric pytest_exit_code"},{"id":"49","name":"collectBaselineTrials wraps an unparsable checkpoint_results.jsonl line in an AdapterError naming path and line number"},{"id":"50","name":"collectBaselineTrials rejects a valid-JSON checkpoint_results.jsonl line that is not an object"},{"id":"51","name":"collectBaselineTrials rejects a checkpoint_results.jsonl record missing core_total"},{"id":"52","name":"collectBaselineTrials rejects a checkpoint_results.jsonl record missing problem"},{"id":"53","name":"collectBaselineTrials rejects a checkpoint_results.jsonl record missing checkpoint"},{"id":"54","name":"collectBaselineTrials rejects a checkpoint_results.jsonl record missing state"},{"id":"55","name":"collectBaselineTrials rejects a checkpoint_results.jsonl record missing core_passed"},{"id":"56","name":"collectBaselineTrials collects the committed smoke evidence from the real filesystem"},{"id":"57","name":"evaluateTrialVerdict returns missing-evidence when there is no native evaluation"},{"id":"58","name":"evaluateTrialVerdict returns infrastructure-failure when the evaluation reports one"},{"id":"59","name":"evaluateTrialVerdict returns pass when Core pass_counts equals total_counts"},{"id":"60","name":"evaluateTrialVerdict returns fail when Core pass_counts is less than total_counts"},{"id":"61","name":"evaluateTrialVerdict treats a missing Core key in pass_counts/total_counts as 0/0 (upstream vacuous pass)"},{"id":"62","name":"generateBaselineReport renders \"no trials\" fallbacks across every section for zero trials"},{"id":"63","name":"generateBaselineReport shows the PRELIMINARY banner (with trial count + config scope) below threshold, and omits it at/above threshold"},{"id":"64","name":"generateBaselineReport sums elapsed time and cost across trials"},{"id":"65","name":"generateBaselineReport aggregates routing/failover attempts by model+task, including failover reasons"},{"id":"66","name":"generateBaselineReport renders checker outcomes for trials with and without a checker summary"},{"id":"67","name":"generateBaselineReport renders failure notes only for trials that carry a failure"},{"id":"68","name":"generateBaselineReport is deterministic across repeated calls with the same inputs (no wall-clock or random state)"},{"id":"69","name":"generateBaselineReport renders native evidence presence in the Trials section"},{"id":"70","name":"generateBaselineReport a ready manifest with no native evidence cannot render as a benchmark pass"},{"id":"71","name":"generateBaselineReport renders pass/fail/infrastructure-failure verdicts with mixed denominators"},{"id":"72","name":"generateBaselineReport renders \"Core 0/0\" when the Core key is absent from pass_counts/total_counts"},{"id":"73","name":"generateBaselineReport groups erosion by evaluation.problem_name, ordering checkpoints numerically"},{"id":"74","name":"generateBaselineReport falls back to lexicographic checkpoint_name ordering when neither checkpoint has a trailing integer"},{"id":"75","name":"generateBaselineReport tiebreaks by trial id when checkpoint_name is identical across trials in a problem"},{"id":"76","name":"generateBaselineReport states the not-yet-measurable erosion sentence when no trial carries native evaluation evidence"},{"id":"77","name":"baseline report drift regenerates the committed report.md byte-identically from the committed config + manifests"},{"id":"78","name":"smoke checkpoint run twice (reproducibility) produces host-independent, comparable manifests across two independent trials"}],"source":"import { existsSync, mkdirSync, mkdtempSync, readFileSync, rmSync, writeFileSync, type Dirent } from 'node:fs';\nimport { tmpdir } from 'node:os';\nimport { join } from 'node:path';\nimport { fileURLToPath } from 'node:url';\n\nimport { afterEach, describe, expect, it } from 'vitest';\n\nimport {\n  collectBaselineTrials,\n  evaluateTrialVerdict,\n  generateBaselineReport,\n  loadBaselineConfig,\n  type BaselineConfig,\n  type BaselineFsDeps,\n  type BaselineTrial,\n  type BaselineTrialEvidence,\n  type ScbenchEvaluation,\n} from './baseline.js';\nimport { AdapterError, type ScbenchCheckpoint } from './checkpoint.js';\nimport { minimalManifest } from './manifest-fixture.js';\nimport { runCheckpoint } from './run-checkpoint.js';\nimport { createExecaExec, type ExecFn } from './workspace.js';\n\nconst BASELINE_CONFIG_PATH = fileURLToPath(\n  new URL('../../../evals/scbench-baseline/baseline.config.json', import.meta.url),\n);\nconst REPORT_PATH = fileURLToPath(new URL('../../../evals/scbench-baseline/report.md', import.meta.url));\nconst PIN_PATH = fileURLToPath(new URL('../scbench.pin.json', import.meta.url));\n// Relative to the repo root (vitest runs from there — see AGENTS.md), matching\n// the --runs value the CLI was invoked with to produce the committed report.md.\n// The recorded trial ids/manifestPaths must match exactly for the drift test below.\nconst RUNS_DIR = 'evals/scbench-baseline/runs';\n\nconst VALID_CONFIG = {\n  baselineId: 'test-baseline',\n  factory: { repo: 'https://example.com/repo', commit: 'a'.repeat(40), packageVersion: '2.0.0' },\n  scbench: { repo: 'https://example.com/scbench', commit: 'b'.repeat(40), pinnedAt: '2026-07-28' },\n  problemCatalog: {\n    repo: 'https://example.com/problems',\n    version: 'v1.0',\n    commit: 'c'.repeat(40),\n    pinnedAt: '2026-07-29',\n  },\n  modelConfig: { source: 'models.json', env: { FACTORY_LOCAL_ONLY: 'unset' } },\n  promptInputs: 'briefs from materializeBrief',\n  environment: { node: '>=20', requiredBinaries: ['git'], hostClass: 'test', scbenchHarness: 'python' },\n  problems: { resolvedFrom: 'resolved from the catalog commit', smoke: 'alpha', suite: ['alpha', 'beta', 'gamma'] },\n  trials: { smokeRuns: 2, suiteTrialsPerProblem: 3 },\n  comparisonThreshold: 10,\n  passPolicy: { id: 'core-cases' as const, description: 'Core-group tests must all pass.' },\n};\n\nfunction minimalEvaluation(overrides: Partial<"+"ScbenchEvaluation> = {}): ScbenchEvaluation {\n  return {\n    problem_name: 'calculator',\n    checkpoint_name: 'checkpoint_1',\n    pass_counts: { Core: 3, Functionality: 2 },\n    total_counts: { Core: 3, Functionality: 2 },\n    pytest_exit_code: 0,\n    infrastructure_failure: false,\n    ...overrides,\n  };\n}\n\ndescribe('loadBaselineConfig', () => {\n  it('accepts the committed baseline config', () => {\n    const raw = readFileSync(BASELINE_CONFIG_PATH, 'utf-8');\n    const config = loadBaselineConfig(raw);\n    expect(config.baselineId).toBe('scbench-baseline-2026-07');\n    expect(config.comparisonThreshold).toBe(10);\n    expect(config.passPolicy).toEqual({\n      id: 'core-cases',\n      description: expect.stringContaining('PassPolicy.CORE_CASES'),\n    });\n    expect(config.problemCatalog.commit).toBe('4d38d300059667d57e43c31969bc455f5c338b52');\n    expect(config.problems.smoke).toBe('cfgpipe');\n    expect(config.problems.suite).toEqual(['cfgpipe', 'circuit_eval', 'code_search']);\n  });\n\n  it('accepts a well-formed synthetic config', () => {\n    expect(loadBaselineConfig(JSON.stringify(VALID_CONFIG))).toEqual(VALID_CONFIG);\n  });\n\n  it('rejects unparsable JSON', () => {\n    expect(() => loadBaselineConfig('{not json')).toThrow(AdapterError);\n  });\n\n  it('rejects a non-object JSON value', () => {\n    expect(() => loadBaselineConfig('42')).toThrow(/must be a JSON object/);\n    expect(() => loadBaselineConfig('[1,2,3]')).toThrow(/must be a JSON object/);\n  });\n\n  it('rejects a config missing a required top-level key', () => {\n    const { trials: _trials, ...missingTrials } = VALID_CONFIG;\n    expect(() => loadBaselineConfig(JSON.stringify(missingTrials))).toThrow(/missing required field \"trials\"/);\n  });\n\n  it('rejects a non-positive comparisonThreshold', () => {\n    expect(() => loadBaselineConfig(JSON.stringify({ ...VALID_CONFIG, comparisonThreshold: 0 }))).toThrow(\n      /comparisonThreshold.*positive/,\n    );\n    expect(() => loadBaselineConfig(JSON.stringify({ ...VALID_CONFIG, comparisonThreshold: '10' }))).toThrow(\n      /comparisonThreshold.*positive/,\n    );\n  });\n\n  it('rejects a malformed factory.commit', () => {\n    expect(() =>\n      loadBaselineConfig(JSON.stringify({ ...VALID_CONFIG, factory: { ...VALID_CONFIG.factory, commit: 'short' } })),\n    ).toThrow(/factory\\.commit/);\n  });\n\n  it('rejects a malformed scbench.commit', () => {\n    expect(() =>\n      loadBaselineConfig(JSON.stringify({ ...VALID_CONFIG, scbench: { ...VALID_CONFIG.scbench, commit: 'nope' } })),\n    ).toThrow(/scbench\\.commit/);\n  });\n\n  it('rejects a config missing passPolicy', () => {\n    const { passPolicy: _passPolicy, ...missingPassPolicy } = VALID_CONFIG;\n    expect(() => loadBaselineConfig(JSON.stringify(missingPassPolicy))).toThrow(/missing required field \"passPolicy\"/);\n  });\n\n  it('rejects a passPolicy.id other than \"core-cases\"', () => {\n    expect(() =>\n      loadBaselineConfig(JSON.stringify({ ...VALID_CONFIG, passPolicy: { id: 'all-cases', description: 'x' } })),\n    ).toThrow(/passPolicy\\.id/);\n  });\n\n  it('rejects a missing or empty passPolicy.description', () => {\n    expect(() =>\n      loadBaselineConfig(JSON.stringify({ ...VALID_CONFIG, passPolicy: { id: 'core-cases', description: '' } })),\n    ).toThrow(/passPolicy\\.description/);\n    expect(() => loadBaselineConfig(JSON.stringify({ ...VALID_CONFIG, passPolicy: { id: 'core-cases' } }))).toThrow(\n      /passPolicy\\.description/,\n    );\n  });\n\n  it('rejects a malformed problemCatalog.commit', () => {\n    expect(() =>\n      loadBaselineConfig(\n        JSON.stringify({ ...VALID_CONFIG, problemCatalog: { ...VALID_CONFIG.problemCatalog, commit: 'short' } }),\n      ),\n    ).toThrow(/problemCatalog\\.commit/);\n  });\n\n  it('rejects an empty problemCatalog.version', () => {\n    expect(() =>\n      loadBaselineConfig(\n        JSON.stringify({ ...VALID_CONFIG, problemCatalog: { ...VALID_CONFIG.problemCatalog, version: '' } }),\n      ),\n    ).toThrow(/problemCatalog\\.version/);\n  });\n\n  it('rejects problems.smoke as a prose selection rule instead of an exact id', () => {\n    expect(() =>\n      loadBaselineConfig(\n        JSON.stringify({\n          ...VALID_CONFIG,\n          problems: { ...VALID_CONFIG.problems, smoke: 'the lexicographically first problem id' },\n        }),\n      ),\n    ).toThrow(/problems\\.smoke/);\n  });\n\n  it('rejects problems.suite as a string instead of an array', () => {\n    expect(() =>\n      loadBaselineConfig(\n        JSON.stringify({ ...VALID_CONFIG, problems: { ...VALID_CONFIG.problems, suite: 'first three' } }),\n      ),\n    ).toThrow(/problems\\.suite/);\n  });\n\n  it('rejects an empty problems.suite array', () => {\n    expect(() =>\n      loadBaselineConfig(JSON.stringify({ ...VALID_CONFIG, problems: { ...VALID_CONFIG.problems, suite: [] } })),\n    ).toThrow(/problems\\.suite/);\n  });\n\n  it('rejects duplicate ids in problems.suite', () => {\n    expect(() =>\n      loadBaselineConfig(\n        JSON.stringify({ ...VALID_CONFIG, problems: { ...VALID_CONFIG.problems, suite: ['alpha', 'alpha'] } }),\n      ),\n    ).toThrow(/problems\\.suite/);\n  });\n\n  it('rejects an empty problems.resolvedFrom', () => {\n    expect(() =>\n      loadBaselineConfig(JSON.stringify({ ...VALID_CONFIG, problems: { ...VALID_CONFIG.problems, resolvedFrom: '' } })),\n    ).toThrow(/problems\\.resolvedFrom/);\n  });\n});\n\ndescribe('baseline.config.json pin-drift guard', () => {\n  it('matches the committed scbench.pin.json exactly and pins a full-length factory commit SHA', () => {\n    const config = loadBaselineConfig(readFileSync(BASELINE_CONFIG_PATH, 'utf-8'));\n    const { problems: pinProblems, ...pinScbench } = JSON.parse(readFileSync(PIN_PATH, 'utf-8'));\n\n    // Whole-object equality (minus the nested `problems` block, mirrored separately\n    // below) so any future top-level field added to scbench.pin.json must also be\n    // mirrored into baseline.config.json's `scbench` block or this test fails.\n    expect(config.scbench).toEqual(pinScbench);\n    expect(config.problemCatalog).toEqual(pinProblems);\n    expect(config.factory.commit).toMatch(/^[0-9a-f]{40}$/);\n  });\n});\n\nfunction fakeEntry(name: string, isDir: boolean) {\n  return { name, isDirectory: () => isDir } as Dirent;\n}\n\n/** Fake fs deps for collectBaselineTrials tests: `paths` is the exhaustive\n *  set of paths that exist (runsDir, manifest.json files, and any evidence\n *  files under test) — any other existsSync check answers false, so a trial\n *  dir with no evidence entries never attempts to read one. */\nfunction fakeDeps(\n  tree: Record<"+"string, ReturnType<"+"typeof fakeEntry>[]>,\n  files: Record<"+"string, string>,\n  extraExists: string[] = [],\n): BaselineFsDeps {\n  const exists = new Set([...Object.keys(tree), ...Object.keys(files), ...extraExists]);\n  return {\n    existsSync: (path) => exists.has(path),\n    readdirSync: (dir) => tree[dir] ?? [],\n    readFileSync: (path) => {\n      if (!(path in files)) throw new Error(`ENOENT: ${path}`);\n      return files[path];\n    },\n  };\n}\n\ndescribe('collectBaselineTrials', () => {\n  it('recursively finds manifests, sorts by id, and returns [] for an empty dir', () => {\n    const manifestA = JSON.stringify(minimalManifest({ run: { ...minimalManifest().run, outcome: 'failed' } }));\n    const manifestB = JSON.stringify(minimalManifest());\n    const manifestC = JSON.stringify(minimalManifest());\n    const tree: Record<"+"string, ReturnType<"+"typeof fakeEntry>[]> = {\n      '/runs': [\n        fakeEntry('z-problem', true),\n        fakeEntry('m-problem', true),\n        fakeEntry('a-problem', true),\n        fakeEntry('notes.txt', false),\n      ],\n      '/runs/z-problem': [fakeEntry('manifest.json', false)],\n      '/runs/m-problem': [fakeEntry('manifest.json', false)],\n      '/runs/a-problem': [fakeEntry('nested', true)],\n      '/runs/a-problem/nested': [fakeEntry('manifest.json', false)],\n    };\n    const files: Record<"+"string, string> = {\n      '/runs/z-problem/manifest.json': manifestA,\n      '/runs/m-problem/manifest.json': manifestC,\n      '/runs/a-problem/nested/manifest.json': manifestB,\n    };\n    const deps = fakeDeps(tree, files, ['/runs']);\n\n    const trials = collectBaselineTrials('/runs', deps);\n\n    expect(trials.map((t) => t.id)).toEqual(['a-problem/nested', 'm-problem', 'z-problem']);\n    expect(trials[0].manifest.run.outcome).toBe('ready');\n    expect(trials[2].manifest.run.outcome).toBe('failed');\n    expect(trials[0].evidence).toEqual({ runInfoPresent: false });\n    expect(trials[2].evidence).toEqual({ runInfoPresent: false });\n  });\n\n  it('returns [] for an empty directory', () => {\n    const deps: BaselineFsDeps = { existsSync: () => true, readdirSync: () => [], readFileSync: () => '' };\n    expect(collectBaselineTrials('/empty', deps)).toEqual([]);\n  });\n\n  it('rejects a missing --runs directory with an AdapterError instead of a raw ENOENT', () => {\n    const deps: BaselineFsDeps = {\n      existsSync: () => false,\n      readdirSync: () => {\n        throw new Error('ENOENT: should never be reached');\n      },\n      readFileSync: () => '',\n    };\n    expect(() => collectBaselineTrials('/does/not/exist', deps)).toThrow(AdapterError);\n    expect(() => collectBaselineTrials('/does/not/exist', deps)).toThrow(/no such directory/);\n  });\n\n  it('rejects a manifest with the wrong manifestVersion', () => {\n    const deps = fakeDeps(\n      { '/runs': [fakeEntry('manifest.json', false)] },\n      { '/runs/manifest.json': JSON.stringify(minimalManifest({ manifestVersion: 999 })) },\n      ['/runs'],\n    );\n    expect(() => collectBaselineTrials('/runs', deps)).toThrow(/manifest version mismatch/);\n  });\n\n  it('wraps an unparsable manifest in an AdapterError', () => {\n    const deps = fakeDeps({ '/runs': [fakeEntry('manifest.json', false)] }, { '/runs/manifest.json': '{not json' }, [\n      '/runs',\n    ]);\n    expect(() => collectBaselineTrials('/runs', deps)).toThrow(AdapterError);\n  });\n\n  it('loads all three native evidence files when present', () => {\n    const tree = { '/runs': [fakeEntry('manifest.json', false)] };\n    const files = {\n      '/runs/manifest.json': JSON.stringify(minimalManifest()),\n      '/runs/evaluation.json': JSON.stringify(minimalEvaluation()),\n      '/runs/checkpoint_results.jsonl': `${JSON.stringify({\n        problem: 'calculator',\n        checkpoint: 'checkpoint_1',\n        state: 'passed',\n        core_passed: 3,\n        core_total: 3,\n      })}\\n\\n`,\n    };\n    const deps = fakeDeps(tree, files, ['/runs', '/runs/run_info.yaml']);\n\n    const [trial] = collectBaselineTrials('/runs', deps);\n\n    expect(trial.evidence.evaluation).toEqual(minimalEvaluation());\n    expect(trial.evidence.runRecords).toEqual([\n      { problem: 'calculator', checkpoint: 'checkpoint_1', state: 'passed', core_passed: 3, core_total: 3 },\n    ]);\n    expect(trial.evidence.runInfoPresent).toBe(true);\n  });\n\n  it('records no evidence when none of the three files are present', () => {\n    const tree = { '/runs': [fakeEntry('manifest.json', false)] };\n    const files = { '/runs/manifest.json': JSON.stringify(minimalManifest()) };\n    const deps = fakeDeps(tree, files, ['/runs']);\n\n    const [trial] = collectBaselineTrials('/runs', deps);\n\n    expect(trial.evidence).toEqual({ runInfoPresent: false });\n  });\n\n  it('wraps an unparsable evaluation.json in an AdapterError naming the path', () => {\n    const tree = { '/runs': [fakeEntry('manifest.json', false)] };\n    const files = {\n      '/runs/manifest.json': JSON.stringify(minimalManifest()),\n      '/runs/evaluation.json': '{not json',\n    };\n    const deps = fakeDeps(tree, files, ['/runs']);\n    expect(() => collectBaselineTrials('/runs', deps)).toThrow(AdapterError);\n    expect(() => collectBaselineTrials('/runs', deps)).toThrow(/evaluation\\.json/);\n  });\n\n  it('rejects a valid-JSON evaluation.json that is not an object', () => {\n    const tree = { '/runs': [fakeEntry('manifest.json', false)] };\n    const files = {\n      '/runs/manifest.json': JSON.stringify(minimalManifest()),\n      '/runs/evaluation.json': '[1,2,3]',\n    };\n    const deps = fakeDeps(tree, files, ['/runs']);\n    expect(() => collectBaselineTrials('/runs', deps)).toThrow(/evaluation evidence at .*must be a JSON object/);\n  });\n\n  it('rejects evaluation.json with a missing/empty problem_name', () => {\n    const tree = { '/runs': [fakeEntry('manifest.json', false)] };\n    const files = {\n      '/runs/manifest.json': JSON.stringify(minimalManifest()),\n      '/runs/evaluation.json': JSON.stringify(minimalEvaluation({ problem_name: '' })),\n    };\n    const deps = fakeDeps(tree, files, ['/runs']);\n    expect(() => collectBaselineTrials('/runs', deps)).toThrow(/field \"problem_name\" must be a non-empty string/);\n  });\n\n  it('rejects evaluation.json with a missing/empty checkpoint_name', () => {\n    const tree = { '/runs': [fakeEntry('manifest.json', false)] };\n    const files = {\n      '/runs/manifest.json': JSON.stringify(minimalManifest()),\n      '/runs/evaluation.json': JSON.stringify(minimalEvaluation({ checkpoint_name: '' })),\n    };\n    const deps = fakeDeps(tree, files, ['/runs']);\n    expect(() => collectBaselineTrials('/runs', deps)).toThrow(/field \"checkpoint_name\" must be a non-empty string/);\n  });\n\n  it('rejects evaluation.json with a non-boolean infrastructure_failure', () => {\n    const tree = { '/runs': [fakeEntry('manifest.json', false)] };\n    const files = {\n      '/runs/manifest.json': JSON.stringify(minimalManifest()),\n      '/runs/evaluation.json': JSON.stringify(\n       /field \"state\" must be a string/,\n    ],\n    [\n      'core_passed',\n      { problem: 'calculator', checkpoint: 'checkpoint_1', state: 'passed', core_total: 3 },\n      /field \"core_passed\" must be a number/,\n    ],\n  ];\n\n  it.each(RUN_RECORD_FIELD_CASES)('rejects a checkpoint_results.jsonl record missing %s', (_field, record, re) => {\n    const tree = { '/runs': [fakeEntry('manifest.json', false)] };\n    const files = {\n      '/runs/manifest.json': JSON.stringify(minimalManifest()),\n      '/runs/checkpoint_results.jsonl': JSON.stringify(record),\n    };\n    const deps = fakeDeps(tree, files, ['/runs']);\n    expect(() => collectBaselineTrials('/runs', deps)).toThrow(re);\n  });\n\n  it('collects the committed smoke evidence from the real filesystem', () => {\n    const trials = collectBaselineTrials(RUNS_DIR);\n    expect(trials.map((t) => t.id)).toEqual(['smoke/trial-1', 'smoke/trial-2']);\n    for (const trial of trials) {\n      expect(trial.evidence).toEqual({ runInfoPresent: false });\n    }\n  });\n});\n\nfunction trialAt(\n  id: string,\n  overrides: Parameters<"+"typeof minimalManifest>[0] = {},\n  evidence: BaselineTrialEvidence = { runInfoPresent: false },\n): BaselineTrial {\n  return {\n    id,\n    manifestPath: `evals/scbench-baseline/runs/${id}/manifest.json`,\n    manifest: minimalManifest(overrides),\n    evidence,\n  };\n}\n\ndescribe('evaluateTrialVerdict', () => {\n  it('returns missing-evidence when there is no native evaluation', () => {\n    expect(evaluateTrialVerdict(trialAt('a'))).toBe('missing-evidence');\n  });\n\n  it('returns infrastructure-failure when the evaluation reports one', () => {\n    const trial = trialAt(\n      'a',\n      {},\n      { evaluation: minimalEvaluation({ infrastructure_failure: true }), runInfoPresent: false },\n    );\n    expect(evaluateTrialVerdict(trial)).toBe('infrastructure-failure');\n  });\n\n  it('returns pass when Core pass_counts equals total_counts', () => {\n    const trial =
