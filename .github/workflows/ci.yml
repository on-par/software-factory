name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required `ci` check is the gate job at the end. The work runs in parallel
  # before it: `static` (format, build, guards, typecheck, lint, knip) and three
  # Vitest shards that each record test results and raw coverage into a blob report.
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Prettier's cache lives outside node_modules (npm ci wipes it) and is keyed on
      # file content, since a fresh checkout resets every mtime.
      - name: Restore Prettier cache
        uses: actions/cache@v6
        with:
          path: .tmp/prettier-cache
          key: prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.prettierrc*', '.prettierignore') }}-${{ github.sha }}
          restore-keys: prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.prettierrc*', '.prettierignore') }}-

      - name: Format check
        run: npm run format:check -- --cache --cache-strategy content --cache-location .tmp/prettier-cache

      - name: Build
        run: npm run build

      - name: Config JSON guard
        run: bash scripts/check-config-json.sh

      - name: CLI JSON Schema guard
        run: bash scripts/check-cli-json-schemas.sh

      - name: CLI JSON contract guard
        if: github.event_name == 'pull_request'
        env:
          CLI_JSON_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npx tsx scripts/check-cli-json-contract.ts --base "$CLI_JSON_BASE_SHA"

      - name: Oxlint plugin version guard
        run: bash scripts/check-oxlint-plugin-version.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Knip
        run: npm run knip

  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Hard ceiling: a worker that starves the event loop cannot be stopped by
    # Vitest's own (timer-based) test timeout, only by the runner (#755).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test shard
        env:
          # Exercise the same inherited configuration transport as daemon CHECK runs.
          FACTORY_RUN_CONFIG_JSON: '{"version":2}'
          # Raw coverage only: thresholds apply to the merged report in `ci`, never per shard.
          FACTORY_COVERAGE_SHARD: '1'
        run: >-
          npm run test --
          --shard=${{ matrix.shard }}/3
          --reporter=default --reporter=github-actions --reporter=blob
          --outputFile.blob=vitest-blob/blob-${{ matrix.shard }}-3.json

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: vitest-blob/
          if-no-files-found: error
          retention-days: 1

  # The required status check. It runs even when a needed job failed or was
  # cancelled, and fails unless every one of them succeeded, so a red shard or a
  # red `static` can never yield a green `ci` (a skipped required check counts as
  # passing). It then merges the shard reports and enforces coverage on the result.
  ci:
    name: ci
    needs: [static, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require static and every test shard to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null || {
            echo "::error::ci: a required job did not succeed (see above)"
            exit 1
          }

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: vitest-blob
          merge-multiple: true

      - name: Merge reports & coverage
        id: merge
        run: npm run test -- --merge-reports=vitest-blob

      - name: Coverage ratchet
        run: npm run coverage-ratchet

      - name: Coverage summary
        if: ${{ !cancelled() && steps.merge.outcome != 'skipped' }}
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log("## Coverage");
              console.log("");
              console.log("| Metric | Coverage | Covered/Total |");
              console.log("| --- | --- | --- |");
              for (const k of ["lines", "statements", "branches", "functions"]) console.log(row(k));
            ' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage summary found (coverage/coverage-summary.json missing)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifact
        if: ${{ !cancelled() && steps.merge.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
            coverage/cobertura-coverage.xml
          if-no-files-found: warn

      - name: Eval (deterministic, stub)
        run: npm run eval -- --stub

  quickstart:
    name: quickstart-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Quickstart smoke (pack → install → factory init)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/quickstart-smoke.sh

  auto-merge-sweep-test:
    name: auto-merge-sweep-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Merge-exit-code regression test
        run: bash scripts/auto-merge-sweep.test.sh
      - name: filter-green-prs unit test
        run: bash scripts/filter-green-prs.test.sh
      - name: repo-merge-settings unit test
        run: bash scripts/repo-merge-settings.test.sh
      - name: repo-about unit test
        run: bash scripts/repo-about.test.sh
      - name: repo-issue-optics unit test
        run: bash scripts/repo-issue-optics.test.sh
      - name: ruleset-copilot-review unit test
        run: bash scripts/ruleset-copilot-review.test.sh
      - name: publish-workspaces guard
        run: bash scripts/publish-workspaces.test.sh
      - name: publish-release unit test
        run: bash scripts/publish-release.test.sh
      - name: set-release-version unit test
        run: bash scripts/set-release-version.test.sh
