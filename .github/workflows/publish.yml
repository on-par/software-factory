name: Publish
on:
  push:
    # A main push publishes the next X.Y.Z-next.N prerelease to `next`; a v* tag publishes
    # that exact version (see scripts/publish-release.sh).
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: pack and list every package, publish nothing'
        type: boolean
        default: true
# One publish at a time per ref, so two quick merges to main can't race to the same
# -next.N. A newer pending run replaces an older pending one; it contains that commit.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Verify
        run: bash scripts/verify.sh
      - name: Quickstart smoke
        # Same env as ci.yml's quickstart-smoke job: the packed CLI runs `factory init`.
        env: { GH_TOKEN: '${{ github.token }}' }
        run: bash scripts/quickstart-smoke.sh
      # #2335: one step gates on the v1.0 blockers (#195, #151) and publishes. Every path
      # writes `PUBLISHED <list>` or `NOT PUBLISHED: <reason>` to the job summary and sets
      # `published=true|false`. Anything but a dry run that does not publish fails the job.
      # #2244: the version and dist-tag come from the tag name: vX.Y.Z-next.N publishes
      # X.Y.Z-next.N to `next`, vX.Y.Z publishes X.Y.Z to `latest`. The step dry-runs
      # every package (with exact internal pins) before the real publish.
      # #2627: id-token: write + --provenance enable trusted publishing; publish-release.sh
      # fails early on npm < 11.5.1.
      # #2630: no NODE_AUTH_TOKEN is passed, so npm must authenticate via OIDC.
      - name: Publish to npm
        id: publish
        env:
          GH_TOKEN: '${{ github.token }}'
          PUBLISH_DRY_RUN: '${{ inputs.dry_run }}'
          PUBLISH_PRERELEASE: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
        run: bash scripts/publish-release.sh
