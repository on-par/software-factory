name: Publish
on:
  push:
    # A v* tag publishes that exact version (see scripts/publish-release.sh).
    tags: ['v*']
  # A green CI run on a main push publishes the next X.Y.Z-next.N prerelease to `next`.
  # CI already ran the full gate on that commit, so this path skips Verify and the smoke.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: pack and list every package, publish nothing'
        type: boolean
        default: true
# One publish at a time per ref, so two quick merges to main can't race to the same
# -next.N. A newer pending run replaces an older pending one; it contains that commit.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    # Main prereleases publish only commits whose push-triggered CI passed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # A release tag squash-merged from a PR whose head has the same tree and green CI already
      # passed the full gate, so it only installs and builds; anything else runs Verify.
      - name: Prior CI
        id: prior
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: '${{ github.token }}'
          SHA: '${{ github.sha }}'
          REPO: '${{ github.repository }}'
        run: bash scripts/release-prior-ci.sh
      - name: Verify
        if: github.event_name != 'workflow_run' && steps.prior.outputs.verified != 'true'
        run: bash scripts/verify.sh
      - name: Install and build
        if: github.event_name == 'workflow_run' || steps.prior.outputs.verified == 'true'
        run: npm ci && npm run build
      - name: Quickstart smoke
        if: github.event_name != 'workflow_run'
        # Same env as ci.yml's quickstart-smoke job: the packed CLI runs `factory init`.
        env: { GH_TOKEN: '${{ github.token }}' }
        run: bash scripts/quickstart-smoke.sh
      # #2335: one step gates on the v1.0 blockers (#195, #151) and publishes. Every path
      # writes `PUBLISHED <list>` or `NOT PUBLISHED: <reason>` to the job summary and sets
      # `published=true|false`. Anything but a dry run that does not publish fails the job.
      # #2244: the version and dist-tag come from the tag name: vX.Y.Z-next.N publishes
      # X.Y.Z-next.N to `next`, vX.Y.Z publishes X.Y.Z to `latest`. The step dry-runs
      # every package (with exact internal pins) before the real publish.
      # #2627: id-token: write + --provenance enable trusted publishing; publish-release.sh
      # fails early on npm < 11.5.1.
      # #2630: no NODE_AUTH_TOKEN is passed, so npm must authenticate via OIDC.
      # #3676: a vX.Y.Z tag fails closed unless CHANGELOG.md has a `## X.Y.Z` section
      # (docs/ops/docs-and-changelog.md).
      - name: Publish to npm
        id: publish
        env:
          GH_TOKEN: '${{ github.token }}'
          PUBLISH_DRY_RUN: '${{ inputs.dry_run }}'
          PUBLISH_PRERELEASE: "${{ github.event_name == 'workflow_run' }}"
        run: bash scripts/publish-release.sh
      # The image installs these exact tarballs, so it never waits for the registry to show the publish.
      - name: Pack release tarballs
        if: startsWith(github.ref, 'refs/tags/v') && steps.publish.outputs.published == 'true'
        run: bash scripts/pack-release-tarballs.sh "$RUNNER_TEMP/pkgs"
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v') && steps.publish.outputs.published == 'true'
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/pkgs/*.tgz
          retention-days: 7
          if-no-files-found: error
  # #3902: the one-shot factory job image for disposable containers (Foreman / Cloudflare), built from the
  # tarballs this tag just published. Release tags only; main prereleases do not publish an image.
  image:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - name: Derive image version
        id: meta
        env:
          REF_NAME: '${{ github.ref_name }}'
        run: |
          version="${REF_NAME#v}"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          claude_code_version="$(sed -n 's/^CLAUDE_CODE_VERSION=//p' scripts/factory-run.sh | head -n 1)"
          test -n "$claude_code_version"
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "claude_code_version=$claude_code_version"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: release-tarballs
          path: docker/factory-job/pkgs
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/factory-job
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          cache-from: type=gha,scope=factory-job
          cache-to: type=gha,scope=factory-job,mode=max
          build-args: |
            FACTORY_VERSION=${{ steps.meta.outputs.version }}
            CLAUDE_CODE_VERSION=${{ steps.meta.outputs.claude_code_version }}
          tags: |
            ghcr.io/on-par/factory-job:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.prerelease == 'false' && 'ghcr.io/on-par/factory-job:latest' || '' }}
      - name: Record image digest
        env:
          DIGEST: '${{ steps.build.outputs.digest }}'
          VERSION: '${{ steps.meta.outputs.version }}'
        run: |
          echo "ghcr.io/on-par/factory-job:$VERSION @ $DIGEST"
          echo "Published \`ghcr.io/on-par/factory-job:$VERSION\` (\`$DIGEST\`)" >> "$GITHUB_STEP_SUMMARY"
