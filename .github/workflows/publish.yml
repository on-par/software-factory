name: Publish
on:
  push:
    # A v* tag publishes that exact version (see scripts/publish-release.sh).
    tags: ['v*']
  # A green CI run on a main push publishes the next X.Y.Z-next.N prerelease to `next`.
  # CI already ran the full gate on that commit, so this path skips Verify and the smoke.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: pack and list every package, publish nothing'
        type: boolean
        default: true
# One publish at a time per ref, so two quick merges to main can't race to the same
# -next.N. A newer pending run replaces an older pending one; it contains that commit.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    # Main prereleases publish only commits whose push-triggered CI passed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Verify
        if: github.event_name != 'workflow_run'
        run: bash scripts/verify.sh
      - name: Install and build
        if: github.event_name == 'workflow_run'
        run: npm ci && npm run build
      - name: Quickstart smoke
        if: github.event_name != 'workflow_run'
        # Same env as ci.yml's quickstart-smoke job: the packed CLI runs `factory init`.
        env: { GH_TOKEN: '${{ github.token }}' }
        run: bash scripts/quickstart-smoke.sh
      # #2335: one step gates on the v1.0 blockers (#195, #151) and publishes. Every path
      # writes `PUBLISHED <list>` or `NOT PUBLISHED: <reason>` to the job summary and sets
      # `published=true|false`. Anything but a dry run that does not publish fails the job.
      # #2244: the version and dist-tag come from the tag name: vX.Y.Z-next.N publishes
      # X.Y.Z-next.N to `next`, vX.Y.Z publishes X.Y.Z to `latest`. The step dry-runs
      # every package (with exact internal pins) before the real publish.
      # #2627: id-token: write + --provenance enable trusted publishing; publish-release.sh
      # fails early on npm < 11.5.1.
      # #2630: no NODE_AUTH_TOKEN is passed, so npm must authenticate via OIDC.
      # #3676: a vX.Y.Z tag fails closed unless CHANGELOG.md has a `## X.Y.Z` section
      # (docs/ops/docs-and-changelog.md).
      - name: Publish to npm
        id: publish
        env:
          GH_TOKEN: '${{ github.token }}'
          PUBLISH_DRY_RUN: '${{ inputs.dry_run }}'
          PUBLISH_PRERELEASE: "${{ github.event_name == 'workflow_run' }}"
        run: bash scripts/publish-release.sh
