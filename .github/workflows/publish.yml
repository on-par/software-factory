name: Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: pack and list every package, publish nothing'
        type: boolean
        default: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: read }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Verify
        run: bash scripts/verify.sh
      - name: Quickstart smoke
        # Same env as ci.yml's quickstart-smoke job: the packed CLI runs `factory init`.
        env: { GH_TOKEN: '${{ github.token }}' }
        run: bash scripts/quickstart-smoke.sh
      # #2335: one step gates on the v1.0 blockers (#195, #151) and publishes. Every path
      # writes `PUBLISHED <list>` or `NOT PUBLISHED: <reason>` to the job summary and sets
      # `published=true|false`. Anything but a dry run that does not publish fails the job.
      # #2244: the version and dist-tag come from the tag name: vX.Y.Z-next.N publishes
      # X.Y.Z-next.N to `next`, vX.Y.Z publishes X.Y.Z to `latest`. The step dry-runs
      # every package (with exact internal pins) before the real publish.
      - name: Publish to npm
        id: publish
        env:
          GH_TOKEN: '${{ github.token }}'
          NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'
          PUBLISH_DRY_RUN: '${{ inputs.dry_run }}'
        run: bash scripts/publish-release.sh
