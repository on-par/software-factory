# Reusable workflow (#3197): run one allowlisted factory command on a GitHub-hosted runner.
# Callers pin it by tag; see docs/runbooks/github-actions-run.md.
# FACTORY_CLI_VERSION must equal the lockstep package version (guarded by scripts/factory-run.test.sh).
name: Factory run
on:
  workflow_call:
    inputs:
      command:
        description: Factory command (allowlist run-issue, ship, doctor)
        type: string
        required: false
        default: run-issue
      issue:
        description: Issue number (required for run-issue and ship)
        type: string
        required: false
        default: ''
      provider:
        description: Agent provider (claude-cli, codex-cli, opencode, pi)
        type: string
        required: false
        default: claude-cli
      experimental:
        description: Required true for the experimental providers opencode and pi
        type: boolean
        required: false
        default: false
      plan_model:
        description: Override FACTORY_PLAN_MODEL (default per provider)
        type: string
        required: false
        default: ''
      build_model:
        description: Override FACTORY_BUILD_MODEL (default per provider)
        type: string
        required: false
        default: ''
    secrets:
      FACTORY_GITHUB_TOKEN:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      CODEX_API_KEY:
        required: false
      OPENCODE_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false

env:
  FACTORY_CLI_VERSION: 0.9.21

jobs:
  run:
    name: factory-run
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.FACTORY_GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        with:
          repository: on-par/software-factory
          ref: v${{ env.FACTORY_CLI_VERSION }}
          path: .factory-action
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install factory CLI
        run: npm install -g "@on-par/factory-cli@${FACTORY_CLI_VERSION}"
      - name: Set git identity for Actions
        run: |
          git config --local user.name "Software Factory Actions"
          git config --local user.email "factory-actions[bot]@users.noreply.github.com"
      - name: Run factory
        env:
          COMMAND: ${{ inputs.command }}
          ISSUE: ${{ inputs.issue }}
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          PROVIDER: ${{ inputs.provider }}
          EXPERIMENTAL: ${{ inputs.experimental }}
          FACTORY_PLAN_MODEL: ${{ inputs.plan_model }}
          FACTORY_BUILD_MODEL: ${{ inputs.build_model }}
          FACTORY_MERGE: '1'
          FACTORY_MERGE_ADMIN: '1'
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.provider == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.provider == 'claude-cli' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.provider == 'codex-cli' && secrets.OPENAI_API_KEY || '' }}
          CODEX_API_KEY: ${{ inputs.provider == 'codex-cli' && secrets.CODEX_API_KEY || '' }}
          OPENCODE_API_KEY: ${{ inputs.provider == 'opencode' && secrets.OPENCODE_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ inputs.provider == 'pi' && secrets.OPENROUTER_API_KEY || '' }}
          FACTORY_RUN_LOG: ${{ runner.temp }}/factory-run.log
        run: bash .factory-action/scripts/factory-run.sh
      - name: Upload run log and events
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: factory-run-log
          path: |
            ${{ runner.temp }}/factory-run.log
            .factory/events.ndjson
          if-no-files-found: warn
          retention-days: 14
