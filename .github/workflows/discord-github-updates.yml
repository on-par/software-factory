name: Discord GitHub updates

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.event_name != 'check_suite' || github.event.check_suite.app.name == 'GitHub Actions' }}
    runs-on: ubuntu-latest
    env:
      DISCORD_GITHUB_UPDATES_WEBHOOK: ${{ secrets.DISCORD_GITHUB_UPDATES_WEBHOOK }}
    steps:
      - name: Build notification
        id: notification
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.pull_request_review.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.pull_request_review.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url || github.event.pull_request_review.pull_request.html_url }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEWER: ${{ github.event.review.user.login }}
          CHECK_BRANCH: ${{ github.event.check_suite.head_branch }}
          CHECK_CONCLUSION: ${{ github.event.check_suite.conclusion }}
          CHECK_SHA: ${{ github.event.check_suite.head_sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              if [[ "$EVENT_ACTION" == "closed" && "$PR_MERGED" == "true" ]]; then
                message="✅ PR #$PR_NUMBER merged: $PR_TITLE"$'\n'"$PR_URL"
              else
                message="🔀 PR #$PR_NUMBER $EVENT_ACTION: $PR_TITLE"$'\n'"$PR_URL"
              fi
              ;;
            pull_request_review)
              message="📝 Review $REVIEW_STATE from @$REVIEWER on PR #$PR_NUMBER: $PR_TITLE"$'\n'"$PR_URL"
              ;;
            check_suite)
              # check_suite payloads carry no `name` and no `html_url`, so the old
              # message rendered as "SUCCESS CI:" with an empty second line. Build
              # both halves from fields that do exist.
              conclusion=$(printf '%s' "$CHECK_CONCLUSION" | tr '[:lower:]' '[:upper:]')
              message="$conclusion CI on $CHECK_BRANCH"$'\n'"https://github.com/$REPOSITORY/commit/$CHECK_SHA/checks"
              ;;
          esac
          # Random delimiter: a PR titled exactly "EOF" would close a fixed heredoc
          # early and let arbitrary text into the step outputs.
          delimiter="msg-$(openssl rand -hex 16)"
          {
            echo "message<<$delimiter"
            echo "$message"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        if: ${{ env.DISCORD_GITHUB_UPDATES_WEBHOOK != '' }}
        env:
          MESSAGE: ${{ steps.notification.outputs.message }}
        run: |
          if [[ -z "${MESSAGE//[[:space:]]/}" ]]; then
            echo "No message built for this event; nothing to post."
            exit 0
          fi
          payload=$(jq -nc --arg content "$MESSAGE" '{content: $content}')
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_GITHUB_UPDATES_WEBHOOK"
