# Risk policy for software-factory (#3388). Schema: packages/config/src/risk.ts.
# This repo file replaces the packaged default rules; paths that match no rule fall back to `med`.
# The highest tier across matching rules wins.
rules:
  - id: merge-land
    tier: high
    description: Merge and land code, scripts and policy (docs excluded so ADR slugs do not match)
    patterns:
      - '^(?!docs/)(.*[/._-])?(merge|land)([/._-]|$)'
  - id: risk-review-policy
    tier: high
    description: Risk policy, schema and review engine
    globs:
      - '.factory/risk.yml'
      - 'packages/config/src/risk.ts'
      - 'packages/core/src/review/**'
  - id: ci-gates
    tier: high
    description: CI workflows, verify gate, coverage thresholds and CI guards
    globs:
      - '.github/workflows/**'
      - 'scripts/verify.sh'
      - 'scripts/coverage-ratchet.ts'
      - '**/vitest.config.ts'
      - 'packages/core/src/run/ci-suppression-guard.ts'
      - 'packages/core/src/run/ci-rework*.ts'
  - id: secrets-auth
    tier: high
    description: Secrets, credentials and authentication code
    globs:
      - '**/.env'
      - '**/.env.*'
    patterns:
      - 'secret|credential|(^|[/._-])(auth\w*|oauth)([/._-]|$)'
  - id: sandbox-egress
    tier: high
    description: Sandbox and egress proxy
    globs:
      - 'packages/core/src/sandbox/**'
      - 'packages/core/src/proxy/**'
  - id: model-routing
    tier: high
    description: Model routing and data-retention routes (ADR-0163)
    globs:
      - 'packages/config/src/defaults.ts'
      - 'packages/config/src/defaults-routes.ts'
  - id: dependencies
    tier: high
    description: Dependency manifests and lockfiles
    globs:
      - '**/package.json'
      - '**/package-lock.json'
  - id: agent-instructions
    tier: high
    description: Agent instructions, skills and constitutions
    globs:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.claude/**'
      - 'packages/config/src/constitutions/**'
  - id: public-api
    tier: med
    description: Public API entry points and published schemas
    globs:
      - 'packages/*/src/index.ts'
      - 'packages/core/src/internal.ts'
      - 'packages/core/src/testing.ts'
      - 'packages/cli/schemas/**'
  - id: build-release
    tier: med
    description: Build, release and tooling configuration
    globs:
      - 'scripts/**'
      - '**/tsconfig*.json'
      - '.github/**'
      - 'tools/**'
  - id: docs
    tier: low
    description: Documentation
    globs:
      - 'docs/**'
      - '**/*.md'
  - id: tests-only
    tier: low
    description: Tests and fixtures
    globs:
      - '**/*.test.ts'
      - '**/*.test.sh'
      - '**/__fixtures__/**'
